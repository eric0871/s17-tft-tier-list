<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="S18 评级">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#07080b">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>S18 世界赛选手评级 · Enchanted Wilds Tactician's Crown</title>
<link rel="preload" href="fonts/tektur-latin-var.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/smiley-sub.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ===== 字体：Tektur（拉丁 / 数字，可变宽度）+ 得意黑（中文，按页面用字子集化）。来源与授权见 fonts/README.md ===== */
@font-face{font-family:"Tektur Variable";font-style:normal;font-display:swap;font-weight:400 900;font-stretch:75% 100%;
  src:url(fonts/tektur-latin-var.woff2) format("woff2-variations"),url(fonts/tektur-latin-var.woff2) format("woff2");
  unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:"Smiley Sans";font-style:normal;font-display:swap;font-weight:400;src:url(fonts/smiley-sub.woff2) format("woff2")}

/* ===== 设计令牌 ===== */
:root{
  --bg:#07080b; --bg2:#0e1016;
  --tx:#eef1f6; --mute:#9aa1ae; --dim:#646b79;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.15);
  --plat:#eef1f6; --silver:#b4bbc7; --graph:#7a8292;
  --gold:#e8c46c; --gold-hi:#fff0c2; --gold-lo:#9e6d17;
  --holo:linear-gradient(115deg,#ffffff 0%,#a2f2ff 16%,#cdb6ff 33%,#ffc3e8 50%,#fff2ad 67%,#aaffd8 84%,#ffffff 100%);
  --goldg:linear-gradient(150deg,var(--gold-hi) 0%,var(--gold) 45%,var(--gold-lo) 100%);
  --fx:"Tektur Variable","Smiley Sans",-apple-system,"PingFang SC",system-ui,sans-serif;
  --zh:"Smiley Sans","Tektur Variable",-apple-system,"PingFang SC",system-ui,sans-serif;
  /* 由 JS 按视口算出 */
  --k:1; --fs:calc(var(--k) * 1px);
  --pad:14px; --gap:12px; --sideW:400px;
  --cw:58px; --ch:78px; --pcw:56px; --pch:75px; --pcols:6;
  --tlw:76px; --tp:8px; --tg:8px; --cg:6px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{position:fixed;inset:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);height:100%}
body{font-family:var(--fx);color:var(--tx);font-size:calc(13 * var(--fs));-webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  background:
    radial-gradient(1200px 520px at 32% -12%, rgba(196,214,255,.10), transparent 70%),
    radial-gradient(900px 600px at 100% 110%, rgba(255,255,255,.035), transparent 70%),
    var(--bg);}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.05;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
img{-webkit-user-drag:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}

/* ===== 骨架：左评级板 / 右（选手池 ⇄ 选手卡） ===== */
.app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr) var(--sideW);gap:var(--gap);touch-action:none;
  padding:max(var(--pad),var(--sat)) max(var(--pad),var(--sar)) max(var(--pad),var(--sab)) max(var(--pad),var(--sal))}
.stage{min-width:0;min-height:0;display:flex;flex-direction:column;gap:calc(10 * var(--fs))}

/* header */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex:none}
.brand{min-width:0}
.kicker{font:600 calc(10.5 * var(--fs))/1 var(--fx);letter-spacing:.32em;color:var(--mute);white-space:nowrap;display:flex;align-items:center;gap:10px}
.kicker i{display:inline-block;width:18px;height:1px;background:var(--holo)}
h1{display:flex;align-items:baseline;gap:calc(12 * var(--fs));margin-top:calc(6 * var(--fs));white-space:nowrap;font-weight:400}
.h-s18{font:900 calc(31 * var(--fs))/1 var(--fx);font-stretch:100%;letter-spacing:.02em;
  background:var(--holo);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:holoText 9s linear infinite}
.h-zh{font:400 calc(31 * var(--fs))/1 var(--zh);letter-spacing:.06em;color:var(--plat)}
.h-date{font:600 calc(12 * var(--fs))/1 var(--fx);letter-spacing:.18em;color:var(--dim);padding-left:calc(12 * var(--fs));border-left:1px solid var(--line2)}
.actions{display:flex;gap:8px;flex:none}
.btn{height:44px;min-width:44px;padding:0 18px;border-radius:12px;display:inline-flex;align-items:center;gap:8px;
  font:400 calc(15 * var(--fs))/1 var(--zh);letter-spacing:.06em;color:var(--tx);
  background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--line2);transition:background .15s, box-shadow .15s, color .15s}
.btn svg{width:17px;height:17px;flex:none}
.btn.primary{color:#0b0c10;background:var(--plat);box-shadow:none}
.btn.primary:active{background:#fff}
.btn.armed{color:#ffd0d0;box-shadow:inset 0 0 0 1px rgba(255,140,140,.6);background:rgba(255,90,90,.08)}

/* ===== 评级板 ===== */
.board{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--tg)}
.tier{flex:1 0 auto;position:relative;display:grid;grid-template-columns:var(--tlw) minmax(0,1fr);border-radius:calc(14 * var(--fs));
  background:linear-gradient(90deg,rgba(255,255,255,.045),rgba(255,255,255,.018) 40%,rgba(255,255,255,.012));
  box-shadow:inset 0 0 0 1px var(--line);transition:box-shadow .2s, background .2s}
.tier::before{content:"";position:absolute;left:0;top:14%;bottom:14%;width:2px;border-radius:2px;background:var(--tc)}
.tier[data-tier="S"]{--tc:var(--holo);--frame:var(--holo);--fw:2px}
.tier[data-tier="A"]{--tc:var(--plat);--frame:linear-gradient(160deg,#ffffff,#c9ced8);--fw:1.5px}
.tier[data-tier="B"]{--tc:var(--silver);--frame:linear-gradient(160deg,#c3c9d3,#6f7685);--fw:1px}
.tier[data-tier="C"]{--tc:var(--graph);--frame:linear-gradient(160deg,#7d8494,#3d424d);--fw:1px}
.tier[data-tier="god"]{--tc:var(--goldg);--frame:var(--goldg);--fw:2px;
  background:linear-gradient(90deg,rgba(232,196,108,.10),rgba(232,196,108,.025) 40%,rgba(255,255,255,.012))}
.tier[data-tier="S"]{background:linear-gradient(90deg,rgba(190,210,255,.085),rgba(255,255,255,.022) 45%,rgba(255,255,255,.012))}
.tl{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(3 * var(--fs));
  border-right:1px solid var(--line)}
.tl b{font:900 calc(46 * var(--fs))/.9 var(--fx);font-stretch:100%;color:var(--plat)}
.tier[data-tier="S"] .tl b{background:var(--holo);background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:holoText 7s linear infinite;
  filter:drop-shadow(0 0 14px rgba(190,220,255,.35))}
.tier[data-tier="B"] .tl b{color:var(--silver)}
.tier[data-tier="C"] .tl b{color:var(--graph)}
.tier[data-tier="god"] .tl b{font:400 calc(19 * var(--fs))/1 var(--zh);letter-spacing:.04em;background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent}
.tl .spat{width:calc(30 * var(--fs));height:calc(30 * var(--fs));display:block}
.tl i{font:600 calc(11 * var(--fs))/1 var(--fx);font-style:normal;letter-spacing:.08em;color:var(--dim);min-height:1em}
.dz{display:flex;flex-wrap:nowrap;align-items:center;gap:0;padding:var(--tp) calc(12 * var(--fs));min-height:calc(var(--ch) + 2 * var(--tp));min-width:0}
.dz>*{margin-left:var(--cg)} .dz>:first-child{margin-left:0}
/* 一档永远一排：人多时像扇开的一把牌，后一张压住前一张，被压的卡把脸挪进露出来的那一条 */
.dz.fanned .card{box-shadow:-5px 0 12px rgba(0,0,0,.55),0 6px 16px rgba(0,0,0,.45)}
.dz.fanned .card.covered:not(.sel) .ph{transform:translateX(calc((var(--vis) - var(--cw)) / 2))}
.dz.fanned .card.covered:not(.sel) .mono span{left:calc(var(--vis) / 2)}
.dz.fanned .card.covered:not(.sel) .nm{right:auto;width:var(--vis);padding:0 2px}
.dz.fanned .card.covered:not(.sel) .nm .n{font-size:calc(var(--cw) * .2 * var(--nfs,1))}
.dz.fanned .card.covered:not(.sel) .nm .c{font-size:calc(var(--cw) * .165 * var(--ncs,1))}
.dz .card.sel{z-index:5}
/* 选中后：档位进入“可放入”状态（不靠悬停，录屏也看得出） */
.board.armed .tier{box-shadow:inset 0 0 0 1px rgba(255,255,255,.13)}
.board.armed .tier .tl{cursor:pointer;background:rgba(255,255,255,.03)}
.board.armed .tl::after{content:"";position:absolute;inset:calc(6 * var(--fs));border-radius:calc(10 * var(--fs));box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);pointer-events:none}
.tier[data-tier="S"] .tl,.tl{transition:background .12s}
.tl b,.tl .spat{transition:transform .18s ease}
.board.armed .tl.press{background:rgba(255,255,255,.12)}
.board.armed .tl.press::after{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.6)}
.board.armed .tl.press b,.board.armed .tl.press .spat{transform:scale(.88);transition:transform .06s}
.tier.over{background:rgba(255,255,255,.075);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55)}
.tier[data-tier="S"].over{box-shadow:inset 0 0 0 1.5px rgba(205,226,255,.85),0 0 28px rgba(170,200,255,.18)}
.tier[data-tier="god"].over{box-shadow:inset 0 0 0 1.5px rgba(232,196,108,.85),0 0 28px rgba(232,196,108,.15)}

/* ===== 选手卡（闪卡） ===== */
.card{--frame:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.07));--fw:1px;
  width:var(--cw);height:var(--ch);flex:none;position:relative;border-radius:calc(var(--cw) * .13);
  background:var(--frame);box-shadow:0 6px 16px rgba(0,0,0,.45);touch-action:none;cursor:grab;
  transition:width .25s ease, height .25s ease, transform .15s ease}
.tier .card{--frame:inherit}
.tier[data-tier] .card{background:var(--frame)}
.card{--glow:200,212,235;--ga:.20}
.tier[data-tier="S"] .card{--glow:185,214,255;--ga:.34}
.tier[data-tier="A"] .card{--glow:225,230,240;--ga:.24}
.tier[data-tier="B"] .card{--glow:190,196,208;--ga:.16}
.tier[data-tier="C"] .card{--glow:150,156,168;--ga:.10}
.tier[data-tier="god"] .card{--glow:232,196,108;--ga:.30}
.card .art{position:absolute;inset:var(--fw);border-radius:calc(var(--cw) * .13 - var(--fw));overflow:hidden;
  background:radial-gradient(95% 62% at 50% 34%,rgba(var(--glow),var(--ga)),transparent 72%),linear-gradient(172deg,#1e2129,#0b0c10 80%)}
.card .ph{position:absolute;left:0;top:calc(var(--ch) * .015);width:100%;height:auto;pointer-events:none;display:block}
.card .art::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 52%,rgba(6,7,10,.6) 70%,rgba(6,7,10,.95) 100%)}
.mono{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(90% 60% at 50% 8%,rgba(255,255,255,.12),transparent 70%),linear-gradient(165deg,#1c1f27,#0c0d12)}
.mono span{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);white-space:nowrap;
  font:900 calc(var(--cw) * .82)/1 var(--fx);font-stretch:75%;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.34)}
.mono span.zh{font:400 calc(var(--cw) * .62)/1 var(--zh);-webkit-text-stroke:1px rgba(255,255,255,.36)}
.card .fl{position:absolute;top:calc(var(--fw) + 3px);left:calc(var(--fw) + 3px);width:calc(var(--cw) * .25);height:auto;border-radius:2px;z-index:2;
  box-shadow:0 0 0 1px rgba(0,0,0,.45);pointer-events:none}
.nm{position:absolute;left:0;right:0;bottom:calc(var(--ch) * .045 + var(--fw));z-index:2;text-align:center;padding:0 3px;pointer-events:none}
.nm .n{display:block;white-space:nowrap;font:650 calc(var(--cw) * .2 * var(--nf,1))/1.05 var(--fx);font-stretch:var(--ns,82%);color:#fff;letter-spacing:.01em}
.nm .c{display:block;white-space:nowrap;margin-top:1px;font:400 calc(var(--cw) * .165)/1.05 var(--zh);color:rgba(238,241,246,.7)}
.card .gl{position:absolute;inset:var(--fw);border-radius:inherit;overflow:hidden;pointer-events:none;z-index:3;display:none}
.card .gl::before{content:"";position:absolute;top:0;bottom:0;left:-100%;width:300%;
  background:linear-gradient(105deg,transparent 38%,rgba(190,240,255,.20) 45%,rgba(255,200,240,.24) 50%,rgba(255,245,190,.18) 55%,transparent 62%);
  mix-blend-mode:screen;animation:sheen 4.8s ease-in-out infinite;animation-delay:var(--sd,0s)}
.tier[data-tier="S"] .card .gl,.tier[data-tier="god"] .card .gl{display:block}
.tier[data-tier="god"] .card .gl::before{background:linear-gradient(105deg,transparent 40%,rgba(255,236,170,.28) 50%,transparent 60%)}
.card.sel{transform:translateY(-2px);box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff,0 12px 26px rgba(0,0,0,.6),0 0 30px rgba(220,232,255,.35)}
.card.lifted{display:none}
.slot{width:var(--cw);height:var(--ch);flex:none;border-radius:calc(var(--cw) * .13);background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.45);pointer-events:none}
.tier[data-tier="S"] .slot{box-shadow:inset 0 0 0 1.5px rgba(205,226,255,.9),0 0 18px rgba(170,200,255,.25)}
.tier[data-tier="god"] .slot{box-shadow:inset 0 0 0 1.5px rgba(232,196,108,.9)}
.ghost{position:fixed;left:0;top:0;z-index:80;pointer-events:none;margin:0;transition:none;
  box-shadow:0 24px 50px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.3);will-change:transform}
.ghost .gl{display:block}

/* 落位动效 */
.card.land,.card.land-big,.card.land-gold{z-index:6}
.card.land{animation:land .62s cubic-bezier(.18,1.35,.4,1)}
.card.land-big{animation:landBig .9s cubic-bezier(.16,1.3,.36,1)}
.card.land-gold{animation:landGold .85s cubic-bezier(.3,1.5,.5,1)}
@keyframes land{0%{transform:scale(1.28);filter:brightness(2)}55%{transform:scale(.95)}100%{transform:none;filter:none}}
@keyframes landBig{0%{transform:scale(1.7) rotate(-4deg);filter:brightness(3) saturate(1.4)}45%{transform:scale(.92) rotate(1deg);filter:brightness(1.4)}70%{transform:scale(1.04)}100%{transform:none;filter:none}}
@keyframes landGold{0%{transform:translateY(-60%) rotate(8deg) scale(1.2);filter:brightness(1.8) sepia(.4)}50%{transform:translateY(6%) rotate(-2deg) scale(.96)}72%{transform:translateY(-4%)}100%{transform:none;filter:none}}
.tier .sweep{position:absolute;inset:0;border-radius:inherit;pointer-events:none;overflow:hidden}
.tier .sweep::before{content:"";position:absolute;top:0;bottom:0;left:-60%;width:60%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.16),transparent);animation:sweep .9s ease-out forwards}
.tier[data-tier="S"] .sweep::before{width:70%;background:linear-gradient(100deg,transparent,rgba(170,240,255,.22),rgba(255,190,235,.26),rgba(255,245,180,.2),transparent)}
.tier[data-tier="god"] .sweep::before{background:linear-gradient(100deg,transparent,rgba(255,226,150,.26),transparent)}
@keyframes sweep{to{transform:translateX(270%)}}
.tier.hit .tl b,.tier.hit .tl .spat{animation:labelHit .8s ease-out}
.tier[data-tier="S"].hit .tl b{animation:labelHit .8s ease-out, holoText 7s linear infinite}
@keyframes labelHit{0%{transform:scale(1)}25%{transform:scale(1.28);filter:brightness(1.8) drop-shadow(0 0 16px rgba(255,255,255,.7))}100%{transform:scale(1)}}
.tier.thud{animation:thud .45s ease-out}
@keyframes thud{20%{transform:translateY(3px)}45%{transform:translateY(-1px)}100%{transform:none}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.ring{position:absolute;border-radius:50%;transform:translate(-50%,-50%);border:2px solid var(--c);animation:ring .75s ease-out forwards}
.ring.holo{border:0;background:conic-gradient(from 0deg,#a2f2ff,#cdb6ff,#ffc3e8,#fff2ad,#aaffd8,#a2f2ff);
  -webkit-mask:radial-gradient(closest-side,transparent 86%,#000 88%,#000 98%,transparent);mask:radial-gradient(closest-side,transparent 86%,#000 88%,#000 98%,transparent)}
@keyframes ring{from{width:24px;height:24px;opacity:1}to{width:var(--rs,170px);height:var(--rs,170px);opacity:0}}
.flash{position:absolute;border-radius:50%;transform:translate(-50%,-50%);width:260px;height:260px;
  background:radial-gradient(closest-side,rgba(255,255,255,.55),rgba(200,225,255,.18) 45%,transparent);animation:flash .7s ease-out forwards}
@keyframes flash{from{opacity:1;transform:translate(-50%,-50%) scale(.3)}to{opacity:0;transform:translate(-50%,-50%) scale(1.25)}}
.ray{position:absolute;width:2px;height:var(--l,18px);border-radius:2px;background:linear-gradient(180deg,#fff,var(--c));transform-origin:50% 0;
  animation:ray .75s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes ray{from{transform:rotate(var(--a)) translateY(8px) scaleY(.4);opacity:1}to{transform:rotate(var(--a)) translateY(var(--d)) scaleY(1);opacity:0}}
.coin{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d0,#e8c46c 50%,#8a5d10);
  animation:coin .95s cubic-bezier(.25,.6,.45,1) forwards}
@keyframes coin{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.5) rotate(200deg);opacity:0}}
.fly{position:fixed;left:0;top:0;z-index:75;pointer-events:none;margin:0;box-shadow:0 20px 44px rgba(0,0,0,.65)}

/* ===== 右栏 ===== */
.app.full{grid-template-columns:minmax(0,1fr) 0px;column-gap:0}
.app.full .side{visibility:hidden}
.app.full .board{animation:boardIn .5s ease-out}
@keyframes boardIn{from{opacity:.4}}
.side{position:relative;min-height:0;border-radius:calc(18 * var(--fs));overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.015));box-shadow:inset 0 0 0 1px var(--line)}
.deck{position:absolute;inset:0;display:flex;flex-direction:column;gap:calc(10 * var(--fs));padding:calc(12 * var(--fs));
  transition:opacity .28s ease, transform .28s ease}
.side.open .deck{opacity:0;transform:scale(.97);pointer-events:none}
.deck-h{display:flex;align-items:baseline;justify-content:space-between;flex:none;padding:2px 4px 0}
.deck-h h2{font:400 calc(19 * var(--fs))/1 var(--zh);letter-spacing:.14em;color:var(--plat)}
.deck-h span{font:600 calc(12 * var(--fs))/1 var(--fx);letter-spacing:.12em;color:var(--dim)}
.deck-h span b{color:var(--tx);font-weight:700}
.seg{flex:none;display:grid;grid-template-columns:1.15fr repeat(4,1fr);height:50px;border-radius:12px;padding:3px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px var(--line)}
.seg button{border-radius:9px;font:650 calc(12.5 * var(--fs))/1 var(--fx);letter-spacing:.06em;color:var(--mute);display:flex;align-items:center;justify-content:center;gap:5px}
.seg button em{font-style:normal;font-weight:500;color:var(--dim);font-size:.9em}
.seg button[data-f="ALL"]{font-family:var(--zh);font-weight:400;font-size:calc(14 * var(--fs))}
.seg button.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)}
.seg button.on em{color:var(--mute)}
.pool{flex:1;min-height:0;display:grid;grid-template-columns:repeat(var(--pcols),var(--pcw));gap:var(--pg,6px);justify-content:center;align-content:start;
  --cw:var(--pcw);--ch:var(--pch)}
.pool .card{--frame:linear-gradient(160deg,rgba(255,255,255,.22),rgba(255,255,255,.06))}
.pool .card.hide{display:none}
.pool-empty{grid-column:1/-1;display:none;padding-top:30%;text-align:center;font:400 calc(16 * var(--fs))/1.6 var(--zh);color:var(--dim);letter-spacing:.1em}
.pool.is-empty .pool-empty{display:block}
.side.over::after{content:"松手 · 退回选手池";position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  font:400 calc(20 * var(--fs))/1 var(--zh);letter-spacing:.2em;color:#fff;background:rgba(7,8,11,.78);
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);border-radius:inherit}

/* ===== 选手卡面板 ===== */
.panel{position:absolute;inset:0;display:flex;flex-direction:column;opacity:0;transform:translateX(18px);pointer-events:none;
  transition:opacity .28s ease, transform .28s ease}
.side.open .panel{opacity:1;transform:none;pointer-events:auto}
.pin{flex:1;min-height:0;display:flex;flex-direction:column;gap:var(--pg,calc(10 * var(--fs)));padding:calc(10 * var(--fs))}
.pin>.hero+*{margin-top:auto}.pin>:last-child{margin-bottom:auto}
.hero{--hf:linear-gradient(160deg,rgba(255,255,255,.3),rgba(255,255,255,.08));--hw:1px;
  flex:0 1 33%;max-height:33%;min-height:calc(128 * var(--fs));position:relative;border-radius:calc(14 * var(--fs));padding:var(--hw);background:var(--hf);touch-action:none}
.hero[data-tier="S"]{--hf:var(--holo);--hw:2px}
.hero[data-tier="A"]{--hf:linear-gradient(160deg,#fff,#c9ced8);--hw:1.5px}
.hero[data-tier="god"]{--hf:var(--goldg);--hw:2px}
.hin{position:absolute;inset:var(--hw);border-radius:calc(14 * var(--fs) - var(--hw));overflow:hidden;background:#0a0b0f;isolation:isolate}
.hart{position:absolute;inset:0}
.spot{position:absolute;inset:0;background:radial-gradient(48% 70% at 50% 38%,rgba(var(--hg),.30),transparent 72%),radial-gradient(120% 80% at 50% -10%,rgba(255,255,255,.06),transparent 60%),linear-gradient(175deg,#191c23,#0a0b0f 85%)}
.hero{--hg:205,218,240}
.hero[data-tier="S"]{--hg:180,212,255} .hero[data-tier="god"]{--hg:232,196,108}
.hback{position:absolute;left:0;right:0;top:46%;transform:translateY(-50%);text-align:center;white-space:nowrap;overflow:hidden;
  font:900 calc(118 * var(--fs))/1 var(--fx);font-stretch:75%;letter-spacing:-.01em;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.09)}
.port{position:absolute;left:50%;bottom:calc(30 * var(--fs));transform:translateX(-50%);aspect-ratio:1/1;height:min(calc(100% - 30 * var(--fs)),calc(200 * var(--fs)),250px);
  -webkit-mask-image:radial-gradient(66% 80% at 50% 36%,#000 64%,transparent 100%);mask-image:radial-gradient(66% 80% at 50% 36%,#000 64%,transparent 100%)}
.port img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;filter:drop-shadow(0 10px 24px rgba(0,0,0,.55))}
.hmono{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(70% 90% at 50% 0%,rgba(205,226,255,.16),transparent 70%),linear-gradient(170deg,#161920,#0a0b0f)}
.hmono .big{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);white-space:nowrap;
  font:900 calc(150 * var(--fs))/1 var(--fx);font-stretch:75%;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.28);
  background:var(--holo);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;opacity:.9}
.hmono .big{color:rgba(255,255,255,.035);opacity:.62}
.hmono .big.zh{font:400 calc(118 * var(--fs))/1 var(--zh)}
.hmono .tex{position:absolute;inset:-10% -5%;display:flex;flex-direction:column;justify-content:space-around;transform:rotate(-8deg);opacity:.07;
  font:800 calc(22 * var(--fs))/1 var(--fx);font-stretch:75%;letter-spacing:.3em;white-space:nowrap;color:#fff}
.hshade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,7,10,0) 48%,rgba(6,7,10,.6) 70%,rgba(6,7,10,.97) 100%)}
.glint{position:absolute;inset:0;pointer-events:none;transform:translateX(-110%);
  background:linear-gradient(105deg,transparent 34%,rgba(170,240,255,.22) 44%,rgba(255,200,240,.3) 50%,rgba(255,245,190,.2) 56%,transparent 66%);mix-blend-mode:screen}
.pin.enter .glint{animation:glint 1.15s .18s ease-out forwards}
@keyframes glint{to{transform:translateX(110%)}}
.hname{position:absolute;left:0;right:0;bottom:calc(10 * var(--fs));text-align:center;padding:0 calc(12 * var(--fs))}
.hn{font:850 calc(44 * var(--fs))/.95 var(--fx);font-stretch:88%;letter-spacing:.01em;color:#fff;white-space:nowrap;text-shadow:0 2px 20px rgba(0,0,0,.65)}
.hcn{font:400 calc(18 * var(--fs))/1 var(--zh);color:rgba(238,241,246,.85);letter-spacing:.12em;margin-top:calc(5 * var(--fs))}
.hmeta{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:calc(7 * var(--fs));margin-top:calc(8 * var(--fs));
  font:600 calc(11.5 * var(--fs))/1 var(--fx);letter-spacing:.06em;color:var(--mute)}
.hmeta img{width:calc(18 * var(--fs));height:auto;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.hmeta .sep{width:3px;height:3px;border-radius:50%;background:var(--dim)}
.hmeta .pill{font:400 calc(12 * var(--fs))/1 var(--zh);letter-spacing:.06em;padding:calc(3 * var(--fs)) calc(7 * var(--fs));border-radius:99px;color:var(--tx);box-shadow:inset 0 0 0 1px var(--line2)}
.hmeta .pill.joc{color:var(--gold);box-shadow:inset 0 0 0 1px rgba(232,196,108,.5)}
.hbar{position:absolute;top:calc(8 * var(--fs));left:calc(8 * var(--fs));right:calc(8 * var(--fs));display:flex;justify-content:space-between;align-items:flex-start;z-index:5}
.hbtn{height:44px;min-width:44px;padding:0 14px 0 10px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;
  font:400 calc(14 * var(--fs))/1 var(--zh);letter-spacing:.06em;color:#fff;background:rgba(8,9,12,.55);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hbtn svg{width:16px;height:16px}
.hright{display:flex;gap:6px;align-items:center}
.rated{height:44px;padding:0 12px;border-radius:12px;display:inline-flex;align-items:center;gap:7px;background:rgba(8,9,12,.55);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font:400 calc(12 * var(--fs))/1 var(--zh);color:var(--mute);letter-spacing:.08em}
.rated b{font:900 calc(22 * var(--fs))/1 var(--fx);color:#fff}
.rated[data-t="S"] b{background:var(--holo);-webkit-background-clip:text;background-clip:text;color:transparent}
.rated[data-t="B"] b{color:var(--silver)} .rated[data-t="C"] b{color:var(--graph)}
.rated[data-t="god"] b{font:400 calc(16 * var(--fs))/1 var(--zh);background:var(--goldg);-webkit-background-clip:text;background-clip:text;color:transparent}

.qual{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 calc(4 * var(--fs))}
.qual span{font:400 calc(12.5 * var(--fs))/1 var(--zh);color:var(--dim);letter-spacing:.14em}
.qual b{font:400 calc(16 * var(--fs))/1.1 var(--zh);color:var(--plat);letter-spacing:.04em;text-align:right}
.sec{flex:none}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:calc(5 * var(--fs));padding:0 calc(4 * var(--fs))}
.sec-h h3{font:400 calc(13 * var(--fs))/1 var(--zh);letter-spacing:.2em;color:var(--plat);display:flex;align-items:center;gap:8px;white-space:nowrap}
.sec-h h3::before{content:"";flex:none;width:calc(7 * var(--fs));height:calc(7 * var(--fs));border-radius:1.5px;transform:rotate(45deg);background:var(--holo);background-size:180% 180%;box-shadow:0 0 calc(8 * var(--fs)) rgba(190,215,255,.45)}
.sec-h span{font:500 calc(11 * var(--fs))/1.1 var(--fx);color:var(--dim);letter-spacing:.04em;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.sec-h span b{color:var(--tx);font-weight:700}
.sec-h span b.q{font:400 calc(13.5 * var(--fs))/1 var(--zh);letter-spacing:.04em;color:var(--plat)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:calc(6 * var(--fs))}
.st{position:relative;overflow:hidden;border-radius:calc(10 * var(--fs));padding:calc(8 * var(--fs)) calc(8 * var(--fs)) calc(9 * var(--fs));background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--line)}
.st .lb{font:400 calc(12 * var(--fs))/1 var(--zh);color:var(--mute);letter-spacing:.06em}
.st .v{font:750 calc(28 * var(--fs))/1 var(--fx);font-stretch:90%;margin-top:calc(6 * var(--fs));letter-spacing:-.01em}
.st .rk{font:500 calc(11 * var(--fs))/1 var(--fx);color:var(--dim);margin-top:calc(5 * var(--fs));white-space:nowrap}
.st .rk em{font:400 calc(11 * var(--fs))/1 var(--zh);font-style:normal}
.st .rk b{color:var(--tx);font-weight:750}
.st.lead{background:linear-gradient(160deg,rgba(205,226,255,.11),rgba(255,255,255,.03));box-shadow:inset 0 0 0 1px rgba(205,226,255,.28)}
.st.lead .rk b{background:var(--holo);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
.st .bar{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.05)}
.st .bar i{display:block;height:100%;background:linear-gradient(90deg,rgba(255,255,255,.25),#fff);transform-origin:left;animation:grow .7s .1s ease-out backwards}
.st.lead .bar i{background:var(--holo)}
@keyframes grow{from{transform:scaleX(0)}}
.form{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:calc(3 * var(--fs))}
.pl{height:calc(21 * var(--fs));border-radius:calc(6 * var(--fs));display:flex;align-items:center;justify-content:center;
  font:750 calc(13.5 * var(--fs))/1 var(--fx);animation:pop .32s ease-out backwards}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.p1{background:var(--goldg);color:#2b1d02;box-shadow:0 0 12px rgba(232,196,108,.35)}
.p2,.p3,.p4{background:rgba(238,241,246,.86);color:#0b0c10}
.p5,.p6,.p7{background:rgba(255,255,255,.03);color:var(--mute);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.p8{background:rgba(0,0,0,.3);color:var(--dim);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.formax{display:flex;justify-content:space-between;margin-top:calc(4 * var(--fs));font:500 calc(10 * var(--fs))/1 var(--fx);color:var(--dim);letter-spacing:.04em}
.formax em{font:400 calc(10.5 * var(--fs))/1 var(--zh);font-style:normal}
.wrow{display:grid;grid-template-columns:repeat(var(--wn,7),minmax(0,1fr));gap:calc(4 * var(--fs))}
.wc{height:calc(40 * var(--fs));border-radius:calc(9 * var(--fs));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(3 * var(--fs));
  background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--line);animation:pop .32s ease-out backwards}
.wc .s{font:600 calc(10.5 * var(--fs))/1 var(--fx);color:var(--dim);letter-spacing:.06em}
.wc .p{font:750 calc(17 * var(--fs))/1 var(--fx);font-stretch:88%;color:var(--mute)}
.wc.t8 .p{color:var(--plat)}
.wc.champ{background:linear-gradient(160deg,rgba(255,240,194,.22),rgba(158,109,23,.12));box-shadow:inset 0 0 0 1px rgba(232,196,108,.75),0 0 16px rgba(232,196,108,.18)}
.wc.champ .s{color:var(--gold)}
.wc.champ .p{display:flex;align-items:center;gap:3px;color:var(--gold-hi);font:400 calc(13 * var(--fs))/1 var(--zh)}
.wc.champ svg{width:calc(14 * var(--fs));height:calc(14 * var(--fs))}
.debut{height:calc(40 * var(--fs));border-radius:calc(9 * var(--fs));display:flex;align-items:center;gap:calc(12 * var(--fs));padding:0 calc(12 * var(--fs));
  background:linear-gradient(100deg,rgba(205,226,255,.12),rgba(255,255,255,.02));box-shadow:inset 0 0 0 1px rgba(205,226,255,.3);position:relative;overflow:hidden}
.debut .dw{font:900 calc(22 * var(--fs))/1 var(--fx);font-stretch:75%;letter-spacing:.12em;background:var(--holo);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:holoText 6s linear infinite}
.debut .dt{font:400 calc(15 * var(--fs))/1.1 var(--zh);letter-spacing:.08em;color:#fff}
.debut .dd{font:400 calc(11 * var(--fs))/1.2 var(--zh);color:var(--dim);margin-left:auto;text-align:right}
.rows{display:flex;flex-direction:column;gap:calc(3 * var(--fs))}
.row{height:calc(25 * var(--fs));display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 calc(10 * var(--fs));border-radius:calc(7 * var(--fs));
  background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px var(--line)}
.row .e{font:550 calc(12 * var(--fs))/1 var(--fx);font-stretch:92%;color:#d6dae2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .pp{font:750 calc(14 * var(--fs))/1 var(--fx);white-space:nowrap;color:var(--mute)}
.row .pp.zh{font:400 calc(14 * var(--fs))/1 var(--zh);letter-spacing:.06em}
.row .pp.g{color:var(--gold-hi)} .row .pp.w{color:var(--plat)}
.evs{display:flex;flex-direction:column;gap:calc(3 * var(--fs))}
.evr{height:calc(24 * var(--fs));display:grid;grid-template-columns:calc(34 * var(--fs)) calc(18 * var(--fs)) minmax(0,1fr) auto calc(26 * var(--fs));
  align-items:center;column-gap:calc(8 * var(--fs));padding:0 calc(8 * var(--fs)) 0 calc(9 * var(--fs));border-radius:calc(7 * var(--fs));
  background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px var(--line);animation:up .4s ease-out backwards}
.evr.is-s{background:linear-gradient(90deg,rgba(190,215,255,.10),rgba(255,255,255,.025) 55%);box-shadow:inset 0 0 0 1px rgba(205,226,255,.16)}
.evr .d{font:600 calc(11 * var(--fs))/1 var(--fx);color:var(--dim);letter-spacing:.02em;white-space:nowrap}
.evr .lv{height:calc(17 * var(--fs));border-radius:calc(4 * var(--fs));display:flex;align-items:center;justify-content:center;font:900 calc(11.5 * var(--fs))/1 var(--fx)}
.lv-s{background:var(--holo);color:#0b0c10;box-shadow:0 0 10px rgba(190,220,255,.35)}
.lv-a{color:var(--plat);box-shadow:inset 0 0 0 1px rgba(238,241,246,.5)}
.evr .e{font:550 calc(12 * var(--fs))/1 var(--fx);font-stretch:92%;color:#d6dae2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.evr .pp{font:750 calc(14 * var(--fs))/1 var(--fx);white-space:nowrap;color:var(--mute);text-align:right}
.evr .pp.zh{font:400 calc(14 * var(--fs))/1 var(--zh);letter-spacing:.06em}
.evr .pp.g{color:var(--gold-hi)} .evr .pp.w{color:var(--plat)}
.evr .of{font:500 calc(10.5 * var(--fs))/1 var(--fx);color:var(--dim);white-space:nowrap}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr)) minmax(0,2.05fr);gap:calc(6 * var(--fs))}
.facts .prize span{white-space:nowrap;letter-spacing:0}
.facts .prize span i{font:700 calc(11 * var(--fs))/1 var(--fx);font-style:normal;color:var(--tx)}
.facts .prize b em{font:400 calc(11.5 * var(--fs))/1 var(--zh);font-style:normal;color:var(--mute);margin-right:calc(3 * var(--fs))}
.facts .prize b em.na{margin:0 0 0 calc(7 * var(--fs));font-size:calc(11 * var(--fs));color:var(--dim)}
.facts .prize small{display:block;margin-top:calc(4 * var(--fs));font:400 calc(9.5 * var(--fs))/1 var(--zh);color:var(--dim);white-space:nowrap}
.rv{flex:none;position:relative;overflow:hidden;border-radius:calc(12 * var(--fs));padding:calc(10 * var(--fs)) calc(12 * var(--fs)) calc(11 * var(--fs));
  background:linear-gradient(100deg,rgba(205,226,255,.11),rgba(255,255,255,.025) 42%,rgba(255,255,255,.02) 58%,rgba(255,195,232,.08));
  box-shadow:inset 0 0 0 1px rgba(205,226,255,.22),0 10px 30px rgba(0,0,0,.35);animation:up .45s .3s ease-out backwards}
.rv::before{content:"";position:absolute;left:12%;right:12%;top:0;height:1.5px;background:var(--holo);opacity:.9}
.rv-h{display:flex;align-items:center;justify-content:center;gap:calc(10 * var(--fs))}
.rv-k{font:400 calc(28 * var(--fs))/1 var(--zh);letter-spacing:.4em;padding-left:.4em;background:var(--holo);background-size:220% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;animation:holoText 7s linear infinite;filter:drop-shadow(0 0 14px rgba(190,220,255,.4))}
.rv-e{font:700 calc(10 * var(--fs))/1 var(--fx);letter-spacing:.42em;color:var(--dim)}
.rv-body{display:grid;grid-template-columns:calc(80 * var(--fs)) minmax(0,1fr) calc(80 * var(--fs));align-items:center;gap:calc(8 * var(--fs));margin-top:calc(9 * var(--fs))}
.rv-p{display:flex;flex-direction:column;align-items:center;gap:calc(6 * var(--fs));min-width:0}
.rv-p[data-goto]{cursor:pointer}
.rv-av{--cw:calc(54 * var(--fs));width:calc(54 * var(--fs));height:calc(54 * var(--fs));border-radius:calc(13 * var(--fs));position:relative;overflow:hidden;
  background:radial-gradient(90% 70% at 50% 30%,rgba(205,218,240,.24),transparent 72%),linear-gradient(172deg,#1e2129,#0b0c10 80%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2)}
.rv-p.op .rv-av{background:radial-gradient(90% 70% at 50% 30%,rgba(255,195,232,.22),transparent 72%),linear-gradient(172deg,#1e2129,#0b0c10 80%)}
.rv-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.rv-av .mono span{font-size:calc(34 * var(--fs))}
.rv-p b{font:750 calc(12.5 * var(--fs))/1 var(--fx);font-stretch:80%;white-space:nowrap;max-width:100%;color:var(--plat)}
.rv-p b.long{font-size:calc(10.5 * var(--fs));font-stretch:75%}
.rv-p.op b{color:#fff}
.rv-mid{text-align:center;min-width:0}
.rv-n{font:400 calc(13 * var(--fs))/1 var(--zh);color:var(--mute);letter-spacing:.1em;display:flex;align-items:baseline;justify-content:center;gap:calc(5 * var(--fs))}
.rv-n i{font:850 calc(30 * var(--fs))/1 var(--fx);font-style:normal;color:#fff;letter-spacing:0}
.rv-bar{position:relative;height:calc(6 * var(--fs));border-radius:99px;background:rgba(255,195,232,.16);margin:calc(9 * var(--fs)) 0 calc(7 * var(--fs))}
.rv-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--holo);box-shadow:0 0 10px rgba(190,220,255,.35);transform-origin:left;animation:grow .8s .45s ease-out backwards}
.rv-bar::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:rgba(255,255,255,.4)}
.rv-w{display:flex;justify-content:space-between;font:400 calc(13 * var(--fs))/1 var(--zh);color:var(--mute);letter-spacing:.06em}
.rv-w span:last-child{color:var(--dim)}
.rv-avp{font:400 calc(10.5 * var(--fs))/1 var(--zh);color:var(--dim);letter-spacing:.04em;white-space:nowrap}
.rv-avp i{font:700 calc(12 * var(--fs))/1 var(--fx);font-style:normal;color:var(--plat)}
.rv-d{margin-top:calc(8 * var(--fs));font:400 calc(12.5 * var(--fs))/1 var(--zh);color:var(--mute);letter-spacing:.06em}
.rv-d b{font:800 calc(17 * var(--fs))/1 var(--fx);color:#fff;letter-spacing:0;margin:0 2px}
.rv-w i{font:800 calc(17 * var(--fs))/1 var(--fx);font-style:normal;color:var(--plat);margin:0 calc(2 * var(--fs))}
.rival{margin-top:calc(5 * var(--fs));height:calc(26 * var(--fs));display:flex;align-items:center;gap:calc(9 * var(--fs));padding:0 calc(10 * var(--fs));
  border-radius:calc(8 * var(--fs));background:linear-gradient(90deg,rgba(255,255,255,.055),rgba(255,255,255,.015));box-shadow:inset 0 0 0 1px var(--line)}
.rival .k{font:400 calc(12 * var(--fs))/1 var(--zh);color:var(--mute);letter-spacing:.12em;display:flex;align-items:center;gap:calc(5 * var(--fs));white-space:nowrap}
.rival .k svg{width:calc(13 * var(--fs));height:calc(13 * var(--fs));color:var(--plat)}
.rival b{font:750 calc(14 * var(--fs))/1 var(--fx);font-stretch:88%;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.rival .m{margin-left:auto;font:400 calc(11.5 * var(--fs))/1 var(--zh);color:var(--dim);white-space:nowrap}
.rival .m i{font:700 calc(13 * var(--fs))/1 var(--fx);font-style:normal;color:var(--plat)}
.facts>div{border-radius:calc(9 * var(--fs));padding:calc(7 * var(--fs)) calc(7 * var(--fs));min-width:0;background:rgba(255,255,255,.03);box-shadow:inset 0 0 0 1px var(--line)}
.facts span{display:block;font:400 calc(11 * var(--fs))/1 var(--zh);color:var(--dim);letter-spacing:.06em}
.facts b{display:block;font:750 calc(17 * var(--fs))/1 var(--fx);font-stretch:84%;margin-top:calc(5 * var(--fs));color:var(--plat);white-space:nowrap}
.pin.enter .hero{animation:heroIn .55s cubic-bezier(.2,.9,.25,1)}
.pin.enter .sec,.pin.enter .qual{animation:up .45s ease-out backwards}
.pin.enter .qual{animation-delay:.06s}
.pin.enter .sec:nth-of-type(1){animation-delay:.09s}
.pin.enter .sec:nth-of-type(2){animation-delay:.13s}
.pin.enter .sec:nth-of-type(3){animation-delay:.17s}
.pin.enter .sec:nth-of-type(4){animation-delay:.21s}
.pin.enter .sec:nth-of-type(5){animation-delay:.25s}
@keyframes heroIn{from{opacity:0;transform:perspective(900px) rotateY(-24deg) translateX(30px) scale(.94)}to{opacity:1;transform:none}}
@keyframes up{from{opacity:0;transform:translateY(10px)}}
@keyframes holoText{to{background-position:260% 0}}
@keyframes sheen{0%,45%{transform:translateX(0)}75%,100%{transform:translateX(66%)}}

/* toast / 导出预览 */
.toast{position:fixed;left:50%;bottom:calc(26px + var(--sab));transform:translateX(-50%) translateY(16px);opacity:0;z-index:90;pointer-events:none;
  padding:12px 20px;border-radius:12px;font:400 15px/1 var(--zh);letter-spacing:.06em;color:#fff;background:rgba(20,22,28,.92);box-shadow:inset 0 0 0 1px var(--line2),0 12px 30px rgba(0,0,0,.5);transition:.28s}
.toast.on{opacity:1;transform:translateX(-50%)}
.sheet{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;background:rgba(5,6,8,.82);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sheet.on{display:flex}
.sheet-in{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:86vw;max-height:88vh}
.sheet img{max-width:86vw;max-height:calc(88vh - 110px);border-radius:12px;box-shadow:0 0 0 1px var(--line2),0 30px 60px rgba(0,0,0,.6);
  -webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;pointer-events:auto;touch-action:auto}
.sheet-tip{font:400 14px/1 var(--zh);letter-spacing:.1em;color:var(--mute)}
.sheet #sheetShare[hidden]{display:none}
.sheet-b{display:flex;gap:10px}

/* ===== 导出图（离屏渲染，不影响录屏画面） ===== */
#exportHost{position:fixed;left:-30000px;top:0;pointer-events:none}
.ex{--cw:104px;--ch:139px;--tlw:132px;--tp:12px;--cg:10px;--k:1.3;--fs:1.3px;
  width:1640px;padding:56px 60px 40px;background:
    radial-gradient(1400px 560px at 28% -14%, rgba(196,214,255,.12), transparent 70%),var(--bg);color:var(--tx);font-family:var(--fx)}
.ex *{animation:none!important;transition:none!important}
.ex .card .gl{display:none!important}
.ex-h{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:30px}
.ex-h .kicker{font-size:15px}
.ex-h h1{margin-top:12px}
.ex-h .h-s18,.ex-h .h-zh{font-size:58px}
.ex-h .h-date{font-size:17px}
.ex-mark{font:600 14px/1.5 var(--fx);letter-spacing:.24em;color:var(--dim);text-align:right}
.ex .board{gap:12px}
.ex .tier{flex:none}
.ex .tl b{font-size:72px}
.ex .tier[data-tier="god"] .tl b{font-size:30px}
.ex .tl .spat{width:46px;height:46px}
.ex .tl i{font-size:15px}
.ex-f{display:flex;justify-content:space-between;margin-top:22px;font:600 14px/1 var(--fx);letter-spacing:.24em;color:var(--dim)}
.ex-f b{font:400 16px/1 var(--zh);letter-spacing:.12em;color:var(--mute);font-weight:400}

@media (prefers-reduced-motion:reduce){.card .gl::before,.h-s18,.tier[data-tier="S"] .tl b{animation:none}}
</style>

<body>
<div class="app" id="app">
  <main class="stage">
    <header class="topbar">
      <div class="brand">
        <div class="kicker"><i></i>SET 18 · ENCHANTED WILDS · TACTICIAN'S CROWN</div>
        <h1><span class="h-s18">S18</span><span class="h-zh">世界赛选手评级</span><span class="h-date">11.13 — 11.15</span></h1>
      </div>
      <div class="actions">
        <button class="btn primary" id="export" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>导出图片</button>
        <button class="btn" id="reset" type="button">重置</button>
      </div>
    </header>
    <section class="board" id="board">
      <div class="tier" data-tier="S" data-drop="S"><div class="tl"><b>S</b><i data-cnt></i></div><div class="dz" data-zone="S"></div></div>
      <div class="tier" data-tier="A" data-drop="A"><div class="tl"><b>A</b><i data-cnt></i></div><div class="dz" data-zone="A"></div></div>
      <div class="tier" data-tier="B" data-drop="B"><div class="tl"><b>B</b><i data-cnt></i></div><div class="dz" data-zone="B"></div></div>
      <div class="tier" data-tier="C" data-drop="C"><div class="tl"><b>C</b><i data-cnt></i></div><div class="dz" data-zone="C"></div></div>
      <div class="tier" data-tier="god" data-drop="god"><div class="tl">
        <svg class="spat" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0c2"/><stop offset=".5" stop-color="#e8c46c"/><stop offset="1" stop-color="#9e6d17"/></linearGradient></defs>
          <g transform="rotate(-38 16 16)"><rect x="10.5" y="2.5" width="11" height="13" rx="2.6" fill="url(#gg)"/><rect x="13.2" y="5" width="1.5" height="8" rx=".75" fill="#3b2a06" opacity=".55"/><rect x="17.3" y="5" width="1.5" height="8" rx=".75" fill="#3b2a06" opacity=".55"/><rect x="14.6" y="15" width="2.8" height="4" fill="url(#gg)"/><rect x="13.9" y="18.6" width="4.2" height="11" rx="2.1" fill="url(#gg)"/></g></svg>
        <b>金铲铲</b><i data-cnt></i></div><div class="dz" data-zone="god"></div></div>
    </section>
  </main>
  <aside class="side" id="side" data-drop="pool">
    <div class="deck">
      <div class="deck-h"><h2>选手池</h2><span id="poolCount"></span></div>
      <div class="seg" id="filters">
        <button type="button" class="on" data-f="ALL">全部</button>
        <button type="button" data-f="CN">CN<em></em></button>
        <button type="button" data-f="AMER">AMER<em></em></button>
        <button type="button" data-f="EMEA">EMEA<em></em></button>
        <button type="button" data-f="APAC">APAC<em></em></button>
      </div>
      <div class="pool" id="pool" data-zone="pool"><div class="pool-empty">40 位选手全部评完</div></div>
    </div>
    <div class="panel" id="panel"></div>
  </aside>
</div>
<div id="fx"></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"><div class="sheet-in"><img id="sheetImg" alt="评级图"><div class="sheet-tip">长按图片 → 存储到相册　·　点空白处关闭</div><div class="sheet-b">
  <button class="btn primary" id="sheetShare" type="button">分享 / 存储</button><button class="btn" id="sheetDl" type="button">下载图片</button><button class="btn" id="sheetClose" type="button">关闭</button></div></div></div>
<div id="exportHost"></div>

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
const PLAYERS = __PLAYERS__;
const META = __META__;
const STORE_KEY = "tft-crown-tierlist-s18-v1";
const TIERS = ["S","A","B","C","god"];
const TIER_NAME = {S:"S",A:"A",B:"B",C:"C",god:"金铲铲"};
const REGION_ORDER = {CN:0,AMER:1,EMEA:2,APAC:3};
const byId = Object.fromEntries(PLAYERS.map(p=>[p.id,p]));
const byName = Object.fromEntries(PLAYERS.map(p=>[p.n,p]));
const $ = s=>document.querySelector(s);
const $$ = s=>[...document.querySelectorAll(s)];
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const root = document.documentElement;
let selected = null, filter = "ALL", lastDragEnd = 0;

const CROWN = `<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 7.5 7.5 11 12 4l4.5 7L21 7.5 19.2 18H4.8z"/><rect x="4.8" y="19.2" width="14.4" height="2" rx="1"/></svg>`;
const ICON_BACK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 5-7 7 7 7"/></svg>`;
const ICON_VS = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="m13 19 6-6"/><path d="m16 16 4 4"/><path d="m19 21 2-2"/><path d="M14.5 6.5 18 3h3v3l-3.5 3.5"/><path d="m5 14 4 4"/><path d="m7 17-3 3"/><path d="m3 19 2 2"/></svg>`;
const ICON_OUT = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg>`;

/* ---------- 头像：有照片用照片，没照片用名字做字形卡面 ---------- */
function monoText(p){ return p.cn ? {t:[...p.cn][0], zh:true} : {t:(p.n.replace(/[^A-Za-z0-9]/g,"")[0]||p.n[0]).toUpperCase(), zh:false}; }
function monoEl(p){
  const d=document.createElement("div");d.className="mono";
  const m=monoText(p);d.innerHTML=`<span class="${m.zh?"zh":""}">${esc(m.t)}</span>`;return d;
}
const photoOK = {};   // id -> true/false（加载结果）
const phSrc = p=>p.ph?p.ph.replace(/\.jpg$/,".png"):"";   // 透明底抠图
function art(p){
  const a=document.createElement("div");a.className="art";
  if(p.ph && photoOK[p.id]!==false){
    const im=new Image();im.className="ph";im.alt="";im.draggable=false;im.decoding="async";
    im.onload=()=>{photoOK[p.id]=true;};
    im.onerror=()=>{photoOK[p.id]=false;im.replaceWith(monoEl(p));if(selected===p.id) refreshHeroArt(p);};
    im.src=phSrc(p);a.appendChild(im);
  } else a.appendChild(monoEl(p));
  return a;
}
function makeCard(p){
  const el=document.createElement("div");
  el.className="card";el.dataset.id=p.id;el.dataset.r=p.r;
  el.style.setProperty("--sd",(Math.random()*3).toFixed(2)+"s");
  el.appendChild(art(p));
  const fl=new Image();fl.className="fl";fl.src=`flags/${p.c}.png`;fl.alt="";fl.draggable=false;el.appendChild(fl);
  const nm=document.createElement("div");nm.className="nm";
  nm.innerHTML=`<span class="n">${esc(p.n)}</span>${p.cn?`<span class="c">${esc(p.cn)}</span>`:""}`;
  el.appendChild(nm);
  const gl=document.createElement("i");gl.className="gl";el.appendChild(gl);
  el.addEventListener("pointerdown",e=>onDown(e,p.id));
  return el;
}
const cardEl = id=>document.querySelector(`#app .card[data-id="${CSS.escape(id)}"]`);
const zoneEl = z=>document.querySelector(`[data-zone="${z}"]`);
const zoneOf = card=>card&&card.parentElement?card.parentElement.dataset.zone:null;

/* ---------- 存取 ---------- */
function save(){
  const st={};[...TIERS,"pool"].forEach(z=>st[z]=[...zoneEl(z).querySelectorAll(".card")].map(c=>c.dataset.id));
  st._sel=selected;
  try{localStorage.setItem(STORE_KEY,JSON.stringify(st));}catch(e){}
}
function sortPool(){
  const pool=zoneEl("pool");
  [...pool.querySelectorAll(".card")].sort((a,b)=>{const pa=byId[a.dataset.id],pb=byId[b.dataset.id];
    return (REGION_ORDER[pa.r]-REGION_ORDER[pb.r])||PLAYERS.indexOf(pa)-PLAYERS.indexOf(pb);}).forEach(c=>pool.appendChild(c));
}
function updateCounts(){
  $$(".tier").forEach(t=>{const n=t.querySelectorAll(".dz .card").length;t.querySelector("[data-cnt]").textContent=n?n+" 人":"";});
  const inPool=[...zoneEl("pool").querySelectorAll(".card")];
  $("#poolCount").innerHTML=`待评 <b>${inPool.length}</b> / ${PLAYERS.length}`;
  $$("#filters button").forEach(b=>{const f=b.dataset.f,em=b.querySelector("em");if(em) em.textContent=inPool.filter(c=>c.dataset.r===f).length;});
  zoneEl("pool").classList.toggle("is-empty",inPool.length===0);
}
function render(){
  const cards={};PLAYERS.forEach(p=>cards[p.id]=makeCard(p));
  let st=null;try{st=JSON.parse(localStorage.getItem(STORE_KEY));}catch(e){}
  const placed=new Set();
  if(st) TIERS.forEach(z=>(st[z]||[]).forEach(id=>{if(cards[id]&&!placed.has(id)){zoneEl(z).appendChild(cards[id]);placed.add(id);}}));
  PLAYERS.forEach(p=>{if(!placed.has(p.id)) zoneEl("pool").appendChild(cards[p.id]);});
  sortPool();updateCounts();applyFilter();
  if(st&&st._sel&&byId[st._sel]) select(st._sel,true); else deselect(true);
  updateFull();
}

/* ---------- 筛选 ---------- */
$$("#filters button").forEach(b=>b.addEventListener("click",()=>{
  filter=b.dataset.f;$$("#filters button").forEach(x=>x.classList.toggle("on",x===b));applyFilter();}));
function applyFilter(){$$("#pool .card").forEach(c=>c.classList.toggle("hide",filter!=="ALL"&&c.dataset.r!==filter));}

/* ---------- 选中 / 面板 ---------- */
const pct=v=>v==null?"–":(v*100).toFixed(1).replace(/\.0$/,"")+"%";
const ordZh=n=>n===1?"冠军":n===2?"亚军":n===3?"季军":null;
function deselect(quiet){
  selected=null;$$(".card.sel").forEach(c=>c.classList.remove("sel"));
  $("#side").classList.remove("open");$("#board").classList.remove("armed");
  updateFull();
  if(!quiet) save();
}
function updateFull(){
  const full=!selected&&zoneEl("pool").querySelectorAll(".card").length===0;
  const app=$("#app");
  if(app.classList.contains("full")!==full){app.classList.toggle("full",full);layout();}
}
function heroArtHTML(p){
  if(p.ph && photoOK[p.id]!==false){
    const u=esc(phSrc(p));
    return `<div class="spot"></div><div class="hback">${esc(p.n.toUpperCase())}</div><div class="port"><img src="${u}" alt="" draggable="false" onerror="photoOK['${esc(p.id)}']=false;refreshHeroArt(byId['${esc(p.id)}'])"></div>`;
  }
  const m=monoText(p);const nm=esc(p.n.toUpperCase());
  return `<div class="hmono"><div class="tex">${Array(7).fill(`<div>${(nm+" · ").repeat(6)}</div>`).join("")}</div><div class="big ${m.zh?"zh":""}">${esc(m.zh?p.cn:p.n.replace(/[^A-Za-z0-9]/g,"").slice(0,2).toUpperCase()||m.t)}</div></div>`;
}
function miniArt(q){
  if(!q) return `<div class="mono"><span>?</span></div>`;
  if(q.ph&&photoOK[q.id]!==false) return `<img src="${esc(phSrc(q))}" alt="" draggable="false" onerror="this.outerHTML=monoEl(byId['${esc(q.id)}']).outerHTML">`;
  return monoEl(q).outerHTML;
}
function refreshHeroArt(p){const a=$("#panel .hart");if(a&&selected===p.id) a.innerHTML=heroArtHTML(p);}
function tierOf(id){const z=zoneOf(cardEl(id));return z&&z!=="pool"?z:null;}
function heroTopHTML(p){
  const t=tierOf(p.id);
  return `<button class="hbtn" type="button" data-act="close">${ICON_BACK}选手池</button>
    <div class="hright">${t?`<span class="rated" data-t="${t}">已评<b>${esc(TIER_NAME[t])}</b></span><button class="hbtn" type="button" data-act="out" aria-label="退回选手池">${ICON_OUT}退回</button>`:""}</div>`;
}
function syncHero(){
  if(!selected) return;
  const t=tierOf(selected),h=$("#panel .hero");if(!h) return;
  if(t) h.dataset.tier=t; else delete h.dataset.tier;
  $("#panel .hbar").innerHTML=heroTopHTML(byId[selected]);
}
function select(id,quiet){
  const same=selected===id&&$("#side").classList.contains("open");
  selected=id;const p=byId[id];
  $$(".card.sel").forEach(c=>c.classList.remove("sel"));
  const card=cardEl(id);if(card)card.classList.add("sel");
  $("#side").classList.add("open");$("#board").classList.add("armed");
  updateFull();
  if(same){syncHero();return;}
  const pn=$("#panel");
  const t=tierOf(id);
  const tags=[];
  tags.push(`<img src="flags/${esc(p.c)}.png" alt="">`,`<span>${esc(p.r)}</span>`);
  if(p.tf) tags.push(`<span class="sep"></span><span>${esc(p.tf)}</span>`);
  if(p.tr==="TOC") tags.push(`<span class="pill">端游 · 云顶之弈</span>`);
  if(p.tr==="JOC") tags.push(`<span class="pill joc">手游 · 金铲铲</span>`);
  let h=`<div class="pin${quiet?"":" enter"}">
    <div class="hero" ${t?`data-tier="${t}"`:""}><div class="hin"><div class="hart">${heroArtHTML(p)}</div><div class="hshade"></div><i class="glint"></i>
      <div class="hname"><div class="hn">${esc(p.n)}</div>${p.cn?`<div class="hcn">${esc(p.cn)}</div>`:""}<div class="hmeta">${tags.join("")}</div></div></div>
      <div class="hbar">${heroTopHTML(p)}</div></div>`;
  const s=p.s;
  if(p.q&&!s) h+=`<div class="qual"><span>晋级方式</span><b>${esc(p.q)}</b></div>`;
  if(s){
    const cell=(lb,val,rk)=>`<div class="st ${rk<=5?"lead":""}"><div class="lb">${lb}</div><div class="v">${val}</div><div class="rk"><em>40人中 第</em> <b>${rk}</b></div><div class="bar"><i style="width:${Math.round((41-rk)/40*100)}%"></i></div></div>`;
    h+=`<section class="sec"><div class="sec-h"><h3>S18 本赛季</h3><span>${p.q?`晋级 <b class="q">${esc(p.q)}</b> · `:""}${s.gp} 局</span></div><div class="stats">
      ${cell("平均名次",s.avp.toFixed(2),s.r_avp)}${cell("前四率",pct(s.top4),s.r_top4)}${cell("吃鸡率",pct(s.win),s.r_win)}
      <div class="st"><div class="lb">垫底率</div><div class="v">${pct(s.eighth)}</div><div class="rk"><em>第 8 名占比</em></div></div></div></section>`;
  }
  const W=p.w;
  if(W.length){
    const champs=W.filter(x=>x[1]===1).length,best=Math.min(...W.map(x=>x[1]));
    const bestTxt=champs>1?`冠军 ×${champs}`:(ordZh(best)||"第 "+best+" 名");
    h+=`<section class="sec"><div class="sec-h"><h3>世界赛履历</h3><span>第 <b>${W.length+1}</b> 次出战 · 此前 <b>${W.length}</b> 届 · 最佳 <b>${bestTxt}</b></span></div>
      <div class="wrow" style="--wn:${Math.max(7,W.length)}">${W.map((x,i)=>`<div class="wc ${x[1]===1?"champ":x[1]<=8?"t8":""}" style="animation-delay:${120+i*45}ms"><span class="s">S${x[0]}</span><span class="p">${x[1]===1?CROWN+"冠军":"#"+x[1]}</span></div>`).join("")}</div></section>`;
  } else {
    h+=`<section class="sec"><div class="sec-h"><h3>世界赛履历</h3><span>Championship / Tactician's Crown</span></div>
      <div class="debut"><span class="dw">DEBUT</span><span class="dt">首次登上世界赛</span><span class="dd">此前从未进入过<br>世界赛</span></div></section>`;
  }
  // S18 大赛战绩：本赛季参加的 S 级 / A 级比赛，按时间
  const EV=p.ev||[];
  if(EV.length){
    const nS=EV.filter(x=>x[4]==="S").length,nA=EV.length-nS;
    const plc=v=>{const z=typeof v==="number"?ordZh(v):null;return z?{t:z,zh:1,c:v===1?"g":"w"}:{t:"#"+v,c:""};};
    h+=`<section class="sec"><div class="sec-h"><h3>S18 大赛战绩</h3><span>${[nS?`S 级 <b>${nS}</b> 场`:"",nA?`A 级 <b>${nA}</b> 场`:""].filter(Boolean).join(" · ")} · 按时间</span></div><div class="evs">${EV.map((x,i)=>{const q=plc(x[2]);
      return `<div class="evr ${x[4]==="S"?"is-s":""}" style="animation-delay:${140+i*50}ms"><span class="d">${esc(x[0])}</span><span class="lv lv-${x[4]==="S"?"s":"a"}">${esc(x[4])}</span><span class="e">${esc(x[1])}</span><span class="pp ${q.zh?"zh":""} ${q.c}">${esc(q.t)}</span><span class="of">/${esc(x[3])}</span></div>`;}).join("")}</div></section>`;
  }
  // 生涯：GanglyStats 只收 Set 11 起的赛区赛事 + 历届世界赛；奖金来自 Liquipedia；宿敌没有就整行不出
  const c=p.cr,E=p.e,R=p.rv;
  h+=`<section class="sec"><div class="sec-h"><h3>生涯数据</h3><span>Set 11 起 + 历届世界赛</span></div><div class="facts">

/* 名字放得下：长名字先收窄字宽，再缩字号 */
function fitHero(){
  const el=$("#panel .hn");if(!el) return;
  const port=$("#panel .port"),hn=$("#panel .hname"),hin=$("#panel .hin");
  const base=44*kVal;el.style.fontSize=base+"px";el.style.fontStretch="88%";
  const box=el.parentElement.clientWidth-8;
  if(el.scrollWidth>box){el.style.fontStretch="75%";}
  let fs=base;while(el.scrollWidth>box&&fs>16){fs-=1;el.style.fontSize=fs+"px";}
  if(port&&hn&&hin){
    const nb=hn.offsetHeight+10*kVal,bottom=Math.round(nb*.58),hh=hin.clientHeight;
    const size=Math.max(60,Math.min(hh-bottom+Math.round(6*kVal),Math.min(250,Math.round(200*kVal))));
    // 卡面很高（13 寸 / 电脑）时，头像 + 名字整组往上提，别在头顶留一大块空
    const free=hh-(bottom+size),lift=free>24?Math.round(free*.42):0;
    port.style.bottom=(bottom+lift)+"px";port.style.height=size+"px";
    hn.style.bottom=Math.round(10*kVal+lift)+"px";
    const hb=$("#panel .hback");if(hb) hb.style.top=Math.round(hh-lift-bottom-size*.52)+"px";
  }
}
function fitPanel(){
  const pin=$("#panel .pin");if(!pin) return;
  pin.classList.remove("tight");pin.style.removeProperty("--pg");
  const kids=[...pin.children];if(kids.length<2) return;
  const cs=getComputedStyle(pin),base=parseFloat(cs.rowGap)||0;
  const used=kids.reduce((s,k)=>s+k.offsetHeight,0)+base*(kids.length-1);
  const free=pin.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-used;
  if(free<=1) return;
  // 数据少的人：先把多出来的高度分给各区块之间的留白（每处最多 +26），剩下的才留在数据块上下
  const extra=Math.min(free/(kids.length+1),26*kVal);
  pin.style.setProperty("--pg",(base+extra)+"px");
}
$("#panel").addEventListener("click",e=>{

/* ---------- 放入档位（点选 / 键盘 / 拖动 共用） ---------- */
function place(id,z,opts={}){

  if(z==="pool"){
    zoneEl("pool").appendChild(card);sortPool();applyFilter();updateCounts();

  }

}
function sourceRect(card){
  // 面板开着时从大卡面飞出，否则从卡片原位置
  const hero=$("#side.open .hero");

function flyAndLand(card,z,from){
  layout(true);

  const fly=card.cloneNode(true);fly.classList.remove("sel","land","land-big","land-gold");fly.classList.add("fly");
  const cs=getComputedStyle(card);

  fly.style.setProperty("--cw",to.width+"px");fly.style.setProperty("--ch",to.height+"px");fly.style.setProperty("--fw",cs.getPropertyValue("--fw"));

    {transform:`translate(${to.left}px,${to.top}px) scale(1)`,opacity:1}

function landFx(card,z){

function burst(card,z){

      add("coin",{left:(cx-4)+"px",top:(cy-4)+"px","--dx":Math.cos(a)*d+"px","--dy":(Math.sin(a)*d+40+Math.random()*50)+"px",animationDelay:(Math.random()*.08)+"s"},1100);}

/* ---------- 触控拖动（Pointer Events：手指 / Apple Pencil / 鼠标 同一套） ---------- */
let drag=null;
function onDown(e,id,fromHero){
  if(e.button>0||drag) return;
  if(e.pointerType==="mouse") e.preventDefault();
  // 触控默认把指针“锁”在按下的卡上；拖动时这张卡会被藏起来，所以先解锁，后续移动统一在 window 上收
  try{ if(e.target.hasPointerCapture&&e.target.hasPointerCapture(e.pointerId)) e.target.releasePointerCapture(e.pointerId); }catch(_){}
  drag={id,pid:e.pointerId,sx:e.clientX,sy:e.clientY,started:false,fromHero:!!fromHero,t0:performance.now()};
  addEventListener("pointermove",onMove,{passive:false});
  addEventListener("pointerup",onUp);
  addEventListener("pointercancel",onCancel);
}
function onMove(e){
  if(!drag||e.pointerId!==drag.pid) return;
  if(!drag.started){
    if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<7) return;
    startDrag();
  }
  e.preventDefault();
  drag.x=e.clientX;drag.y=e.clientY;
  if(!drag.raf) drag.raf=requestAnimationFrame(frame);
}
function startDrag(){
  drag.started=true;
  const card=cardEl(drag.id);drag.card=card;
  if(selected!==drag.id) select(drag.id);
  const bc=getComputedStyle($("#board"));
  const w=parseFloat(bc.getPropertyValue("--cw"))||58,h=parseFloat(bc.getPropertyValue("--ch"))||78;
  const g=card.cloneNode(true);g.classList.remove("sel","hide","land","land-big","land-gold");g.classList.add("ghost");
  g.style.width=w+"px";g.style.height=h+"px";g.style.setProperty("--cw",w+"px");g.style.setProperty("--ch",h+"px");
  g.style.background=getComputedStyle(card).background;
  document.body.appendChild(g);drag.g=g;drag.w=w;drag.h=h;drag.vx=0;drag.lx=drag.sx;
  const slot=document.createElement("div");slot.className="slot";drag.slot=slot;
  drag.origZone=zoneOf(card);
  if(drag.origZone!=="pool") card.parentElement.insertBefore(slot,card);
  card.classList.add("lifted");
  if(card.parentElement.classList.contains("dz")) fanTier(card.parentElement);
  document.body.classList.add("is-dragging");
  drag.x=drag.sx;drag.y=drag.sy;frame();
}
function frame(){
  if(!drag||!drag.g) return;drag.raf=0;
  const {x,y,w,h}=drag;
  drag.vx=drag.vx*.7+(x-drag.lx)*.3;drag.lx=x;
  const rot=Math.max(-12,Math.min(12,drag.vx*.8));
  drag.g.style.transform=`translate(${x-w/2}px,${y-h*.62}px) rotate(${rot}deg) scale(1.1)`;
  updateTarget(x,y);
}
function dropTargetAt(x,y){
  const el=document.elementFromPoint(x,y);const d=el&&el.closest("[data-drop]");return d?d.dataset.drop:null;
}
function insertRef(dz,x){
  const items=[...dz.children].filter(c=>!c.classList.contains("lifted"));
  for(let i=0;i<items.length;i++){
    const c=items[i];if(c===drag.slot) continue;
    const b=c.getBoundingClientRect(),nx=items[i+1];
    const visR=nx?Math.min(b.right,nx.getBoundingClientRect().left):b.right;  // 被压住时只算露出来的那一条
    if(x<(b.left+visR)/2) return c;
  }
  return null;
}
function updateTarget(x,y){
  const z=dropTargetAt(x,y);
  if(z!==drag.over){
    $$(".tier.over").forEach(t=>t.classList.remove("over"));$("#side").classList.remove("over");
    if(z==="pool"){ if(drag.origZone!=="pool") $("#side").classList.add("over"); }
    else if(z) document.querySelector(`.tier[data-drop="${z}"]`).classList.add("over");
    drag.over=z;
  }
  const prev=drag.slot.parentElement;
  if(z&&z!=="pool"){
    const dz=zoneEl(z),ref=insertRef(dz,x);
    if(ref){ if(ref.previousElementSibling!==drag.slot) dz.insertBefore(drag.slot,ref); }
    else if(dz.lastElementChild!==drag.slot) dz.appendChild(drag.slot);
  } else if(prev) drag.slot.remove();
  const now=drag.slot.parentElement;
  if(prev!==now||drag.slotIdx!==(now?[...now.children].indexOf(drag.slot):-1)){
    drag.slotIdx=now?[...now.children].indexOf(drag.slot):-1;
    if(prev) fanTier(prev); if(now&&now!==prev) fanTier(now); else if(now) fanTier(now);
  }
}
function endDrag(){
  removeEventListener("pointermove",onMove);removeEventListener("pointerup",onUp);removeEventListener("pointercancel",onCancel);
  if(drag&&drag.raf) cancelAnimationFrame(drag.raf);
  $$(".tier.over").forEach(t=>t.classList.remove("over"));$("#side").classList.remove("over");
  document.body.classList.remove("is-dragging");
}
function onUp(e){
  if(!drag||e.pointerId!==drag.pid) return;
  const d=drag;endDrag();drag=null;
  if(!d.started){ // 轻点
    if(!d.fromHero) select(d.id);
    return;
  }
  lastDragEnd=Date.now();
  const z=dropTargetAt(e.clientX,e.clientY)||null;
  const card=d.card;
  const gRect=d.g.getBoundingClientRect();d.g.remove();
  card.classList.remove("lifted");
  if(z&&z!=="pool"){
    d.slot.parentElement?d.slot.replaceWith(card):zoneEl(z).appendChild(card);
    updateCounts();save();syncHero();layout(true);
    landFx(card,z);
  } else {
    d.slot.remove();
    if(z==="pool"&&d.origZone!=="pool"){ place(d.id,"pool"); } else fanAll();
  }
}
function onCancel(e){
  if(!drag||e.pointerId!==drag.pid) return;
  const d=drag;endDrag();drag=null;
  if(d.g) d.g.remove();if(d.slot) d.slot.remove();if(d.card) d.card.classList.remove("lifted");
  fanAll();
}

const canShareFile=f=>{try{return !!(navigator.canShare&&navigator.share&&navigator.canShare({files:[f]}));}catch(_){return false;}};
const isTouch=matchMedia("(pointer:coarse)").matches||navigator.maxTouchPoints>0;
async function shareOrDownload(auto){

}
function download(){
  const a=document.createElement("a");a.href=URL.createObjectURL(lastExport.blob);a.download="S18-世界赛选手评级.png";
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},4000);
  toast("图片已导出");closeSheet();
}
function openSheet(){$("#sheetImg").src=lastExport.url;$("#sheetShare").hidden=!canShareFile(lastExport.file);$("#sheet").classList.add("on");}
function closeSheet(){$("#sheet").classList.remove("on");}
$("#sheetShare").addEventListener("click",()=>shareOrDownload(false));
$("#sheetDl").addEventListener("click",download);
$("#sheetClose").addEventListener("click",closeSheet);
$("#sheet").addEventListener("click",e=>{if(!e.target.closest("img,button")) closeSheet();});

/* ---------- 版式：按视口算卡片尺寸，保证一屏装下 ---------- */
let kVal=1;
function layout(keepBoard){
  const W=innerWidth,H=innerHeight;
  kVal=Math.max(.9,Math.min(1.42,Math.min(W/1180,H/800)));
  const pad=W>=1600?24:14,gap=W>=1600?20:12;
  const sideW=Math.round(Math.min(W>=1600?560:500,Math.max(370,W*.34)));
  const S=root.style;
  S.setProperty("--k",kVal);S.setProperty("--pad",pad+"px");S.setProperty("--gap",gap+"px");S.setProperty("--sideW",sideW+"px");
  S.setProperty("--tlw",Math.round(76*kVal)+"px");
  const tp=Math.round(8*kVal),tg=Math.round(8*kVal),cg=Math.round(6*kVal);
  S.setProperty("--tp",tp+"px");S.setProperty("--tg",tg+"px");S.setProperty("--cg",cg+"px");
  const board=$("#board");
  // 评级板：每档永远一排。卡高按 5 排算；一排不叠压能放 8 张；
  // 某档超过 8 张就扇开叠压，叠到每张只露 42% 宽（脸刚好完整露出）时，全板卡片一起缩小
  const bh=board.clientHeight,bw=board.clientWidth;
  const dzW=bw-Math.round(76*kVal)-2*Math.round(12*kVal);
  const chH=Math.floor((bh-4*tg-10*tp)/5);
  let cw=Math.min(Math.floor(chH*.75),Math.floor((dzW-7*cg)/8),Math.round(124*kVal));
  const nmax=Math.max(0,...TIERS.map(z=>zoneEl(z).querySelectorAll(".card").length));
  if(nmax>1&&nmax*cw+(nmax-1)*cg>dzW&&(dzW-cw)/(nmax-1)<MIN_VIS*cw) cw=Math.max(44,Math.floor(dzW/(1+MIN_VIS*(nmax-1))));
  let ch=Math.round(cw/.75);
  const setC=()=>{S.setProperty("--cw",cw+"px");S.setProperty("--ch",ch+"px");};
  setC();
  let guard=0;
  while(board.scrollHeight>board.clientHeight+1&&ch>40&&guard++<60){ch-=2;cw=Math.round(ch*.75);setC();}
  fanAll();
  // 选手池：40 张固定按最大能放下的尺寸
  if(!keepBoard&&!$("#app").classList.contains("full")){
    const pool=$("#pool"),pw=pool.clientWidth,ph=pool.clientHeight,pg=Math.round(6*kVal);
    let best={cols:6,w:40};
    for(let cols=4;cols<=9;cols++){
      const w=Math.floor((pw-(cols-1)*pg)/cols),h=Math.round(w/.75),rows=Math.ceil(PLAYERS.length/cols);
      if(rows*h+(rows-1)*pg<=ph&&w>best.w) best={cols,w};
    }
    if(best.w===40){ // 兜底：按高度反推
      for(let cols=5;cols<=10;cols++){const rows=Math.ceil(PLAYERS.length/cols);const h=Math.floor((ph-(rows-1)*pg)/rows);const w=Math.min(Math.floor(h*.75),Math.floor((pw-(cols-1)*pg)/cols));if(w>best.w)best={cols,w};}
    }
    const rows=Math.ceil(PLAYERS.length/best.cols);
    const pch=Math.max(Math.round(best.w/.75),Math.min(Math.round(best.w/.68),Math.floor((ph-(rows-1)*pg)/rows)));
    S.setProperty("--pcols",best.cols);S.setProperty("--pcw",best.w+"px");S.setProperty("--pch",pch+"px");S.setProperty("--pg",pg+"px");
  }
  fitNames();
  if(selected){fitHero();}
}
/* 卡片上的长名字：量一次实际宽度，算缩放系数 */
const nameNf={};
function fitNames(){
  let m=document.getElementById("nmMeasure");
  if(!m){m=document.createElement("span");m.id="nmMeasure";m.style.cssText="position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap;font-weight:650;font-stretch:82%;font-size:100px;letter-spacing:.01em;font-family:var(--fx)";document.body.appendChild(m);}
  // 卡宽 cw 时字号 = .2cw，可用宽约 cw - 8：放不下先收窄字宽（82%→75%），再缩字号
  const avail=(1-8/58)/.2*100;
  PLAYERS.forEach(p=>{m.textContent=p.n;m.style.fontStretch="82%";let w=m.offsetWidth||1,ns="82%";
    if(w>avail){m.style.fontStretch="75%";w=m.offsetWidth||1;ns="75%";}
    nameNf[p.id]={nf:Math.min(1,avail/w*.98),ns,w};});
  $$(".card").forEach(c=>{const v=nameNf[c.dataset.id];if(v){c.style.setProperty("--nf",v.nf);c.style.setProperty("--ns",v.ns);}});
}
/* 一档一排的扇形叠压：算每张卡的间距、哪些被压住、被压住的卡露出多宽 */
const MIN_VIS=.42;
function fanTier(dz,cw,cg){
  const cs=getComputedStyle(dz);
  cw=cw||parseFloat(cs.getPropertyValue("--cw"))||60;
  cg=cg!=null?cg:(parseFloat(cs.getPropertyValue("--cg"))||6);
  const avail=dz.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
  const items=[...dz.children].filter(c=>!c.classList.contains("lifted"));
  const n=items.length;
  let step=cw+cg,fanned=false;
  if(n>1&&n*cw+(n-1)*cg>avail+.5){step=Math.max(2,(avail-cw)/(n-1));fanned=true;}
  const vis=Math.min(step,cw);
  dz.classList.toggle("fanned",fanned);dz.style.setProperty("--vis",vis+"px");
  items.forEach((c,i)=>{
    c.style.marginLeft=i?(step-cw)+"px":"0px";
    const cov=fanned&&i<n-1;c.classList.toggle("covered",cov);
    if(cov&&c.dataset.id){
      const v=nameNf[c.dataset.id],p=byId[c.dataset.id];
      if(v) c.style.setProperty("--nfs",Math.max(.4,Math.min(v.nf,(vis-4)/(v.w*.2*cw/100))));
      if(p&&p.cn) c.style.setProperty("--ncs",Math.max(.4,Math.min(1,(vis-4)/([...p.cn].length*.165*cw))));
    }
  });
}
function fanAll(){document.querySelectorAll("#board .dz").forEach(dz=>fanTier(dz));}
let rT=0;addEventListener("resize",()=>{clearTimeout(rT);rT=setTimeout(()=>layout(),80);});

/* ---------- 屏蔽会打断录屏的系统手势 ---------- */
["gesturestart","gesturechange","gestureend"].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{e.preventDefault();},{passive:false});
document.addEventListener("contextmenu",e=>{if(!e.target.closest("#sheet img")) e.preventDefault();});
document.addEventListener("dblclick",e=>e.preventDefault(),{passive:false});
document.addEventListener("selectstart",e=>e.preventDefault());

render();layout();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(()=>layout());
</script>
