<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S18 世界赛选手评级 · Enchanted Wilds Tactician's Crown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg0:#040b09; --bg1:#0a1f18; --bg2:#123328;
  --ink:#eefaf3; --muted:#8fb3a4; --dim:#5d8273;
  --line:rgba(170,255,214,.12); --line2:rgba(243,210,122,.28);
  --panel:rgba(10,30,24,.66); --panel2:rgba(14,40,32,.78);
  --gold:#f3d27a; --gold2:#c99a2e; --wisp:#7dffd0; --fae:#d792ff;
  --t-s:#ff5c7a; --t-a:#ff9a4a; --t-b:#f1d061; --t-c:#5fd6c4;
  --cn:#ff5d6c; --amer:#5aa8ff; --emea:#4fe0a0; --apac:#c78bff;
  --display:'Cinzel','Noto Sans SC',serif;
  --body:'Noto Sans SC','Microsoft YaHei',sans-serif;
  --num:'Barlow Condensed','Noto Sans SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);overflow:hidden;
  background:
    radial-gradient(1100px 620px at 82% -10%, rgba(215,146,255,.16), transparent 60%),
    radial-gradient(900px 640px at 6% 110%, rgba(125,255,208,.14), transparent 62%),
    radial-gradient(1500px 1000px at 45% 35%, var(--bg2), var(--bg1) 45%, var(--bg0) 85%);}
#wisps{position:fixed;inset:0;z-index:0;pointer-events:none}
/* vines/vignette */
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%)}

.app{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 500px;gap:22px;padding:22px 26px 22px 30px}
.left{display:flex;flex-direction:column;min-height:0}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.kicker{font-family:var(--num);letter-spacing:.34em;font-size:13px;color:var(--wisp);text-transform:uppercase;opacity:.9;display:flex;align-items:center;gap:10px}
.kicker::before{content:"";width:26px;height:1px;background:linear-gradient(90deg,transparent,var(--wisp))}
h1{font-family:var(--body);font-weight:900;font-size:34px;letter-spacing:.04em;margin-top:6px;line-height:1.1;
  background:linear-gradient(180deg,#fffbe9 10%,var(--gold) 70%,var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 14px rgba(243,210,122,.18))}
h1 small{font-family:var(--display);font-size:15px;letter-spacing:.12em;margin-left:12px;-webkit-text-fill-color:var(--muted);font-weight:700}
.actions{display:flex;gap:10px}
.btn{font-family:var(--body);font-weight:700;font-size:13px;cursor:pointer;color:var(--ink);
  background:var(--panel);border:1px solid var(--line);padding:9px 15px;border-radius:999px;transition:.18s;display:flex;align-items:center;gap:7px}
.btn:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(180deg,rgba(243,210,122,.22),rgba(243,210,122,.08));border-color:var(--line2);color:var(--gold)}
.btn.reset:hover{border-color:var(--t-s);color:#ff9aac}

/* board */
#exportArea{border-radius:18px}
.board{display:flex;flex-direction:column;gap:9px}
.tier{display:flex;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  backdrop-filter:blur(8px);transition:box-shadow .3s, border-color .3s;position:relative}
.tier.flash{animation:tierflash .7s ease-out}
@keyframes tierflash{0%{box-shadow:0 0 0 0 var(--tc),inset 0 0 0 0 var(--tc)}35%{box-shadow:0 0 34px 2px var(--tc),inset 0 0 40px -10px var(--tc)}100%{box-shadow:0 0 0 0 transparent}}
.tier-label{flex:0 0 104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;position:relative;
  font-family:var(--display);font-weight:800;font-size:38px;color:#13100a;background:var(--tc)}
.tier-label::after{content:"";position:absolute;inset:0;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 45%,rgba(0,0,0,.18));pointer-events:none}
.tier-label .cnt{font-family:var(--num);font-size:13px;font-weight:700;opacity:.7;letter-spacing:.06em;white-space:nowrap}
.tier[data-tier="S"]{--tc:var(--t-s)} .tier[data-tier="A"]{--tc:var(--t-a)} .tier[data-tier="B"]{--tc:var(--t-b)} .tier[data-tier="C"]{--tc:var(--t-c)}
.tier[data-tier="god"]{--tc:#f3d27a}
.tier[data-tier="god"] .tier-label{background:linear-gradient(135deg,#fff2bf,#f3d27a 40%,#b57f12);font-family:var(--body);font-weight:900;font-size:21px;letter-spacing:.04em;color:#3a2600}
.dropzone{flex:1;min-height:94px;display:flex;flex-wrap:wrap;gap:7px;padding:8px 10px;align-content:flex-start;transition:background .15s}
.dropzone.over{background:rgba(125,255,208,.07)}

.pool-head{display:flex;align-items:center;gap:12px;margin:14px 2px 8px}
.pool-head h2{font-family:var(--body);font-weight:900;font-size:15px;letter-spacing:.18em;color:var(--gold)}
.pool-head .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.filters{display:flex;gap:6px}
.chip{font-family:var(--num);font-weight:700;font-size:13px;letter-spacing:.06em;padding:4px 11px;border-radius:999px;cursor:pointer;
  border:1px solid var(--line);color:var(--muted);background:rgba(0,0,0,.2);display:flex;align-items:center;gap:6px;transition:.15s}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip.on{color:var(--ink);border-color:rgba(255,255,255,.35);background:rgba(255,255,255,.08)}
#pool{flex:1;min-height:110px;overflow:auto;background:rgba(6,20,16,.45);border:1px dashed var(--line);border-radius:14px;padding:10px;
  display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
#pool .card.hide{display:none}

/* card */
.card{width:80px;flex:0 0 auto;cursor:grab;user-select:none;position:relative;
  background:linear-gradient(180deg,rgba(28,62,50,.92),rgba(12,32,26,.95));
  border:1px solid rgba(255,255,255,.07);border-radius:12px;padding:8px 4px 7px;
  display:flex;flex-direction:column;align-items:center;gap:5px;transition:transform .14s, box-shadow .14s, border-color .14s}
.card::before{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;border-radius:2px;background:var(--rc);opacity:.85}
.card:hover{transform:translateY(-2px);border-color:rgba(243,210,122,.5);box-shadow:0 8px 22px rgba(0,0,0,.45)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(243,210,122,.35)}
.card.dragging{opacity:.35;cursor:grabbing}
.card.landed{animation:land .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes land{0%{transform:scale(.6) translateY(-6px);filter:brightness(2.2)}60%{transform:scale(1.12)}100%{transform:scale(1);filter:none}}
.card[data-r="CN"]{--rc:var(--cn)} .card[data-r="AMER"]{--rc:var(--amer)} .card[data-r="EMEA"]{--rc:var(--emea)} .card[data-r="APAC"]{--rc:var(--apac)}
.av{width:52px;height:52px;border-radius:50%;position:relative;flex:0 0 auto;
  box-shadow:0 0 0 2px var(--rc),0 4px 10px rgba(0,0,0,.5)}
.av .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.av .mono{width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--num);font-weight:700;font-size:19px;letter-spacing:.02em;color:#fff;
  background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.22),transparent 55%),linear-gradient(160deg,color-mix(in srgb,var(--rc) 55%,#0c2a20),#08170f)}
.av .fl{position:absolute;right:-3px;bottom:-1px;width:18px;height:12px;border-radius:2px;object-fit:cover;box-shadow:0 0 0 1.5px rgba(0,0,0,.6)}
.nm{font-size:11.5px;line-height:1.12;text-align:center;font-weight:700;max-width:100%;word-break:break-word;color:#e6f6ee}
.nm .cnn{display:block;font-size:10px;font-weight:500;color:var(--muted)}

/* burst */
.spark{position:fixed;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:50;
  background:radial-gradient(circle,#fff,var(--c) 45%,transparent 70%);animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.ring{position:fixed;border-radius:50%;pointer-events:none;z-index:49;border:2px solid var(--c);animation:ring .7s ease-out forwards}
@keyframes ring{from{width:20px;height:20px;opacity:.9;transform:translate(-50%,-50%)}to{width:150px;height:150px;opacity:0;transform:translate(-50%,-50%)}}

/* right panel */
.right{min-height:0;display:flex;flex-direction:column}
.panel{flex:1;min-height:0;overflow:auto;background:linear-gradient(180deg,var(--panel2),rgba(8,24,19,.72));border:1px solid var(--line);
  border-radius:20px;backdrop-filter:blur(10px);position:relative;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
.panel::before{content:"";position:absolute;inset:0;border-radius:20px;pointer-events:none;
  background:radial-gradient(500px 220px at 50% -40px,color-mix(in srgb,var(--rc,var(--wisp)) 30%,transparent),transparent 70%)}
.empty{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--muted);text-align:center;padding:30px}
.empty .orb{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(125,255,208,.55),rgba(125,255,208,.05) 60%,transparent 70%);animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.15);opacity:.7}}
.empty b{color:var(--ink);font-size:18px}
.pin{position:relative;padding:20px 22px 20px}
.pin.enter{animation:pin .38s ease-out}
@keyframes pin{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}

.hero{display:flex;gap:18px;align-items:center}
.hero .av{width:104px;height:104px;box-shadow:0 0 0 3px var(--rc),0 0 30px color-mix(in srgb,var(--rc) 45%,transparent),0 10px 24px rgba(0,0,0,.5)}
.hero .av .mono{font-size:40px}
.hero .av .fl{width:32px;height:21px;right:0;bottom:4px}
.hid{min-width:0}
.hname{font-family:var(--num);font-weight:700;font-size:44px;line-height:.95;letter-spacing:.01em;word-break:break-word}
.hcn{font-size:16px;color:var(--gold);font-weight:700;margin-top:4px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);color:#d7ece2;white-space:nowrap}
.tag.reg{background:color-mix(in srgb,var(--rc) 22%,transparent);border-color:color-mix(in srgb,var(--rc) 60%,transparent);color:#fff}
.tag.joc{background:rgba(243,210,122,.15);border-color:rgba(243,210,122,.5);color:var(--gold)}
.qual{margin-top:13px;display:flex;align-items:center;gap:10px;padding:8px 14px;border-radius:12px;
  background:linear-gradient(90deg,rgba(243,210,122,.14),rgba(243,210,122,.02));border:1px solid rgba(243,210,122,.22)}
.qual .k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.1em}
.qual .v{font-weight:900;font-size:16px;color:var(--gold)}

.sec{margin-top:15px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:7px}
.sec-h h3{font-size:13px;font-weight:900;letter-spacing:.2em;color:var(--wisp)}
.sec-h span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.st{background:rgba(0,0,0,.24);border:1px solid var(--line);border-radius:12px;padding:10px 10px 9px;position:relative;overflow:hidden}
.st .lb{font-size:11.5px;color:var(--muted);font-weight:700}
.st .val{font-family:var(--num);font-weight:700;font-size:31px;line-height:1.05;margin-top:2px}
.st .rk{font-family:var(--num);font-size:13px;font-weight:600;color:var(--muted)}
.st .rk b{color:var(--ink)}
.st.top .rk b{color:var(--gold)}
.st .bar{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--wisp),var(--gold));border-radius:0 3px 3px 0;transition:width .6s ease}

.form{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.pl{height:36px}
.pl{border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--num);font-weight:700;font-size:19px;
  border:1px solid rgba(255,255,255,.08);animation:pop .3s ease-out backwards}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.p1{background:linear-gradient(160deg,#ffe9a3,#d9a227);color:#3a2600;border-color:#ffe9a3;box-shadow:0 0 12px rgba(243,210,122,.45)}
.p2,.p3,.p4{background:rgba(95,214,196,.2);color:#9ff5e3;border-color:rgba(95,214,196,.45)}
.p5,.p6{background:rgba(255,255,255,.06);color:#b4c9c0}
.p7,.p8{background:rgba(255,92,122,.16);color:#ff9fb1;border-color:rgba(255,92,122,.35)}
.formax{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:5px}
.formsum{display:flex;gap:14px;margin-top:4px;font-size:13px;color:var(--muted)}
.formsum b{font-family:var(--num);font-size:17px;color:var(--ink);margin-left:3px}

.wbig{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.wbig .n{font-family:var(--num);font-weight:700;font-size:38px;line-height:1;color:var(--gold)}
.wbig .t{font-size:13px;color:var(--muted);line-height:1.5}
.wbig .t b{color:var(--ink)}
.wlist{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.wc{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:11px;padding:5px 6px 5px;text-align:center;animation:pop .3s ease-out backwards}
.wc .s{font-family:var(--num);font-weight:700;font-size:13px;color:var(--wisp);letter-spacing:.05em}
.wc .sn{font-size:9.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wc .p{font-family:var(--num);font-weight:700;font-size:22px;line-height:1.1}
.wc.champ{background:linear-gradient(160deg,rgba(255,233,163,.28),rgba(217,162,39,.12));border-color:rgba(243,210,122,.7);box-shadow:0 0 16px rgba(243,210,122,.25)}
.wc.champ .p{color:var(--gold)}
.wc.top8 .p{color:#9ff5e3}
.debut{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;border:1px dashed rgba(125,255,208,.4);background:rgba(125,255,208,.06)}
.debut .ic{font-size:26px}
.debut b{font-size:16px}
.debut div{font-size:12.5px;color:var(--muted)}

.rows{display:flex;flex-direction:column;gap:5px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 12px;border-radius:10px;background:rgba(0,0,0,.2);border:1px solid var(--line);font-size:13px}
.row .e{color:#d7ece2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pp{font-family:var(--num);font-weight:700;font-size:18px;white-space:nowrap}
.row .pp.g{color:var(--gold)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mini div{background:rgba(0,0,0,.18);border:1px solid var(--line);border-radius:10px;padding:5px 9px}
.mini span{display:block;font-size:11px;color:var(--muted);font-weight:700}
.mini b{font-family:var(--num);font-size:19px}
.src{margin-top:13px;font-size:11px;color:var(--dim);line-height:1.6}
.src a{color:var(--muted)}
.keys{margin-top:10px;font-size:11px;color:var(--dim)}
.keys kbd{font-family:var(--num);font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted);background:rgba(0,0,0,.3)}

/* export mode */
.exporting .tier{backdrop-filter:none}
.exporting #exportArea{padding:26px 30px 22px;width:1500px;background:radial-gradient(1200px 700px at 80% -10%, rgba(215,146,255,.16), transparent 60%),radial-gradient(1400px 900px at 45% 35%, #123328, #0a1f18 55%, #061410 100%)}
.exporting .card{transition:none!important;animation:none!important}
.exporting .card.sel{border-color:rgba(255,255,255,.07);box-shadow:none}
.exporting .tier-label .cnt{white-space:nowrap}
#exportFoot{display:none}
.exporting #exportFoot{display:flex}
#exportFoot{justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--muted);font-family:var(--num);letter-spacing:.08em}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);opacity:0;background:var(--panel2);border:1px solid var(--line2);
  color:var(--gold);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;transition:.3s}
.toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:1280px){.app{grid-template-columns:minmax(0,1fr) 420px}.hname{font-size:36px}.stats{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){body{overflow:auto}.app{height:auto;grid-template-columns:1fr}.panel{max-height:none}}
</style>
</head>
<body>
<canvas id="wisps"></canvas>
<div class="app">
  <div class="left">
    <div id="exportArea">
      <header>
        <div>
          <div class="kicker">Set 18 · Enchanted Wilds · Tactician's Crown</div>
          <h1>S18 世界赛选手评级<small>11.13 – 11.15</small></h1>
        </div>
        <div class="actions" data-noexport>
          <button class="btn primary" id="export">⤓ 导出图片</button>
          <button class="btn reset" id="reset">重置</button>
        </div>
      </header>
      <div class="board" id="board">
        <div class="tier" data-tier="S"><div class="tier-label">S<span class="cnt" data-cnt></span></div><div class="dropzone" data-zone="S"></div></div>
        <div class="tier" data-tier="A"><div class="tier-label">A<span class="cnt" data-cnt></span></div><div class="dropzone" data-zone="A"></div></div>
        <div class="tier" data-tier="B"><div class="tier-label">B<span class="cnt" data-cnt></span></div><div class="dropzone" data-zone="B"></div></div>
        <div class="tier" data-tier="C"><div class="tier-label">C<span class="cnt" data-cnt></span></div><div class="dropzone" data-zone="C"></div></div>
        <div class="tier" data-tier="god"><div class="tier-label">金铲铲<span class="cnt" data-cnt></span></div><div class="dropzone" data-zone="god"></div></div>
      </div>
      <div id="exportFoot"><span>ENCHANTED WILDS TACTICIAN'S CROWN · 选手评级</span><span>by 小墨</span></div>
    </div>
    <div class="pool-head">
      <h2>选手池</h2><div class="line"></div>
      <div class="filters" id="filters">
        <span class="chip on" data-f="ALL">全部</span>
        <span class="chip" data-f="CN"><i style="background:var(--cn)"></i>CN</span>
        <span class="chip" data-f="AMER"><i style="background:var(--amer)"></i>AMER</span>
        <span class="chip" data-f="EMEA"><i style="background:var(--emea)"></i>EMEA</span>
        <span class="chip" data-f="APAC"><i style="background:var(--apac)"></i>APAC</span>
      </div>
    </div>
    <div id="pool" class="dropzone" data-zone="pool"></div>
  </div>
  <div class="right"><div class="panel" id="panel"></div></div>
</div>
<div class="toast" id="toast"></div>

/* ---------- avatar ---------- */
function initials(n){const s=n.replace(/[^A-Za-z0-9]/g,"");return (s.slice(0,2)||n.slice(0,2)).toUpperCase();}
function avatar(p,big){
  const av=document.createElement("div");av.className="av";
  if(p.ph){const im=new Image();im.className="ph";im.src=p.ph;im.alt=p.n;im.draggable=false;
    im.onerror=()=>{im.replaceWith(mono(p));};av.appendChild(im);}
  else av.appendChild(mono(p));
  const fl=new Image();fl.className="fl";fl.src=`flags/${p.c}.png`;fl.alt=p.c;fl.draggable=false;av.appendChild(fl);
  return av;
}
function mono(p){const d=document.createElement("div");d.className="mono";d.textContent=p.cn?p.cn.slice(0,2):initials(p.n);return d;}

/* ---------- cards ---------- */
function makeCard(p){
  const el=document.createElement("div");
  el.className="card";el.draggable=true;el.dataset.id=p.id;el.dataset.r=p.r;
  el.appendChild(avatar(p));
  const nm=document.createElement("div");nm.className="nm";nm.textContent=p.n;
  if(p.cn){const c=document.createElement("span");c.className="cnn";c.textContent=p.cn;nm.appendChild(c);}
  el.appendChild(nm);
  el.addEventListener("click",()=>select(p.id));
  el.addEventListener("dragstart",e=>{el.classList.add("dragging");e.dataTransfer.effectAllowed="move";try{e.dataTransfer.setData("text/plain",p.id)}catch(_){};select(p.id);});
  el.addEventListener("dragend",()=>{el.classList.remove("dragging");});
  return el;
}
const zones=[...document.querySelectorAll("[data-zone]")];
const zoneEl=z=>document.querySelector(`[data-zone="${z}"]`);
function insertRef(zone,x,y){
  for(const c of zone.querySelectorAll(".card:not(.dragging)")){
    const b=c.getBoundingClientRect();
    if(y<b.top||y>b.bottom) continue;
    if(x<b.left+b.width/2) return c;
  }
  return null;
}
zones.forEach(zone=>{
  zone.addEventListener("dragover",e=>{
    e.preventDefault();zone.classList.add("over");
    const d=document.querySelector(".card.dragging");if(!d)return;
    if(zone.id==="pool"){ if(d.parentElement!==zone){zone.appendChild(d);} return; }
    const ref=insertRef(zone,e.clientX,e.clientY);
    if(ref){ if(ref!==d.nextSibling) zone.insertBefore(d,ref);} else if(zone.lastElementChild!==d) zone.appendChild(d);
  });
  zone.addEventListener("dragleave",e=>{if(!zone.contains(e.relatedTarget))zone.classList.remove("over");});
  zone.addEventListener("drop",e=>{
    e.preventDefault();zone.classList.remove("over");
    const d=document.querySelector(".card.dragging");
    if(d) landed(d,zone.dataset.zone);
  });
});
function landed(card,z){
  if(z==="pool"){sortPool();applyFilter();}
  save();updateCounts();
  if(z==="pool") return;
  card.classList.remove("landed");void card.offsetWidth;card.classList.add("landed");
  const t=card.closest(".tier");t.classList.remove("flash");void t.offsetWidth;t.classList.add("flash");
  burst(card,TIER_COLOR[z],z==="S"||z==="god"?26:14);
}
function burst(card,color,n){
  const b=card.getBoundingClientRect();const cx=b.left+b.width/2,cy=b.top+b.height/2-8;
  const r=document.createElement("div");r.className="ring";r.style.setProperty("--c",color);r.style.left=cx+"px";r.style.top=cy+"px";
  document.body.appendChild(r);setTimeout(()=>r.remove(),800);
  for(let i=0;i<n;i++){
    const s=document.createElement("div");s.className="spark";
    const a=Math.PI*2*i/n+Math.random()*.4,d=40+Math.random()*(n>20?70:40);
    s.style.left=cx+"px";s.style.top=cy+"px";s.style.setProperty("--c",color);
    s.style.setProperty("--dx",Math.cos(a)*d+"px");s.style.setProperty("--dy",Math.sin(a)*d+"px");
    s.style.animationDelay=(Math.random()*.08)+"s";
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
  }
}
function sortPool(){
  const pool=zoneEl("pool");
  [...pool.children].sort((a,b)=>{const pa=byId[a.dataset.id],pb=byId[b.dataset.id];
    return (REGION_ORDER[pa.r]-REGION_ORDER[pb.r])||PLAYERS.indexOf(pa)-PLAYERS.indexOf(pb);}).forEach(c=>pool.appendChild(c));
}
function updateCounts(){
  document.querySelectorAll(".tier").forEach(t=>{const z=t.querySelector(".dropzone");t.querySelector("[data-cnt]").textContent=z.children.length?z.children.length+" 人":"";});
}
function save(){
  const st={};zones.forEach(z=>st[z.dataset.zone]=[...z.querySelectorAll(".card")].map(c=>c.dataset.id));
  st._sel=selected;
  try{localStorage.setItem(STORE_KEY,JSON.stringify(st));}catch(e){}
}
function render(){
  const cards={};PLAYERS.forEach(p=>cards[p.id]=makeCard(p));
  let st=null;try{st=JSON.parse(localStorage.getItem(STORE_KEY));}catch(e){}
  const placed=new Set();
  if(st){["S","A","B","C","god"].forEach(z=>(st[z]||[]).forEach(id=>{if(cards[id]&&!placed.has(id)){zoneEl(z).appendChild(cards[id]);placed.add(id);}}));}
  PLAYERS.forEach(p=>{if(!placed.has(p.id))zoneEl("pool").appendChild(cards[p.id]);});
  sortPool();updateCounts();
  if(st&&st._sel&&byId[st._sel]) select(st._sel,true); else showEmpty();
}

/* ---------- filters ---------- */
let filter="ALL";
document.querySelectorAll("#filters .chip").forEach(c=>c.addEventListener("click",()=>{
  filter=c.dataset.f;document.querySelectorAll("#filters .chip").forEach(x=>x.classList.toggle("on",x===c));applyFilter();}));
function applyFilter(){document.querySelectorAll("#pool .card").forEach(c=>c.classList.toggle("hide",filter!=="ALL"&&c.dataset.r!==filter));}

/* ---------- panel ---------- */
const pct=v=>v==null?"–":(v*100).toFixed(1).replace(/\.0$/,"")+"%";
const ord=n=>n===1?"冠军":n===2?"亚军":n===3?"季军":"#"+n;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function showEmpty(){
  const pn=$("#panel");pn.style.removeProperty("--rc");
  pn.innerHTML=`<div class="empty"><div class="orb"></div><b>点击或拖动选手</b><div>这里会显示他的本赛季数据、最近 20 局和世界赛履历</div></div>`;
}
function select(id,quiet){

  document.querySelectorAll(".card.sel").forEach(c=>c.classList.remove("sel"));
  const card=document.querySelector(`.card[data-id="${id}"]`);if(card)card.classList.add("sel");
  const pn=$("#panel");pn.style.setProperty("--rc",`var(--${p.r.toLowerCase()})`);
  pn.innerHTML="";pn.scrollTop=0;
  const wrap=document.createElement("div");wrap.className="pin"+(quiet?"":" enter");
  // hero
  const hero=document.createElement("div");hero.className="hero";hero.style.setProperty("--rc",`var(--${p.r.toLowerCase()})`);
  hero.appendChild(avatar(p,true));
  const tags=[`<span class="tag reg">${p.r}</span>`];
  if(p.tf) tags.push(`<span class="tag">${esc(p.tf)}</span>`);
  if(p.tr==="JOC") tags.push(`<span class="tag joc">金铲铲 · 手游</span>`);
  if(p.tr==="TOC") tags.push(`<span class="tag">云顶之弈 · 端游</span>`);
  hero.insertAdjacentHTML("beforeend",`<div class="hid"><div class="hname">${esc(p.n)}</div>${p.cn?`<div class="hcn">${esc(p.cn)}</div>`:""}<div class="tags">${tags.join("")}</div></div>`);
  wrap.appendChild(hero);
  let h="";
  if(p.q) h+=`<div class="qual"><span class="k">晋级方式</span><span class="v">${esc(p.q)}</span></div>`;
  // season stats
  const s=p.s;
  if(s){
    const cell=(lb,val,rk,frac)=>`<div class="st ${rk<=5?"top":""}"><div class="lb">${lb}</div><div class="val">${val}</div><div class="rk">40人中 第 <b>${rk}</b></div><div class="bar" style="width:${Math.round(frac*100)}%"></div></div>`;
    h+=`<div class="sec"><div class="sec-h"><h3>S18 本赛季</h3><span>${s.gp} 局 · 正式赛事</span></div><div class="stats">
      ${cell("平均名次",s.avp.toFixed(2),s.r_avp,(41-s.r_avp)/40)}
      ${cell("前四率",pct(s.top4),s.r_top4,(41-s.r_top4)/40)}
      ${cell("吃鸡率",pct(s.win),s.r_win,(41-s.r_win)/40)}
      <div class="st"><div class="lb">垫底率</div><div class="val">${pct(s.eighth)}</div><div class="rk">第 8 名占比</div></div>
    </div></div>`;
  }
  // last 20
  if(p.l20.length){
    const L=p.l20.map(x=>x[0]);const avg=(L.reduce((a,b)=>a+b,0)/L.length).toFixed(2);
    const t4=L.filter(x=>x<=4).length,w=L.filter(x=>x===1).length;
    h+=`<div class="sec"><div class="sec-h"><h3>最近 ${L.length} 局</h3><span>截至 ${esc(p.l20[p.l20.length-1][1])}</span></div>
      <div class="form">${p.l20.map((x,i)=>`<div class="pl p${x[0]}" style="animation-delay:${i*18}ms" title="${esc(x[1])} · ${esc(x[2])}">${x[0]}</div>`).join("")}</div>
      <div class="formax"><span>← 更早</span><span>最近 →</span></div>
      <div class="formsum"><span>均名<b>${avg}</b></span><span>前四<b>${t4}/${L.length}</b></span><span>吃鸡<b>${w}</b></span></div></div>`;
  }
  // worlds
  const W=p.w;
  if(W.length){
    const champs=W.filter(x=>x[1]===1).length,best=Math.min(...W.map(x=>x[1]));
    h+=`<div class="sec"><div class="sec-h"><h3>世界赛履历</h3><span>Championship / Tactician's Crown</span></div>
      <div class="wbig"><div class="n">第${W.length+1}次</div><div class="t">出战世界赛 · 此前已参加 <b>${W.length}</b> 届<br>历史最佳 <b>${champs>1?`冠军 ×${champs}`:ord(best)}</b></div></div>
      <div class="wlist">${W.map((x,i)=>`<div class="wc ${x[1]===1?"champ":x[1]<=8?"top8":""}" style="animation-delay:${i*40}ms" title="${esc(x[3])} · ${x[2]}人"><div class="s">S${x[0]}</div><div class="p">${x[1]===1?"🏆":"#"+x[1]}</div><div class="sn">${esc(x[3])}</div></div>`).join("")}</div></div>`;
  } else {
    h+=`<div class="sec"><div class="sec-h"><h3>世界赛履历</h3></div><div class="debut"><span class="ic">✨</span><span><b>首次登上世界赛</b><div>此前从未进入过 Championship / Tactician's Crown</div></span></div></div>`;
  }
  // best this set
  if(p.b.length){
    h+=`<div class="sec"><div class="sec-h"><h3>本赛季最佳战绩</h3></div><div class="rows">${p.b.map(x=>`<div class="row"><span class="e">${esc(x[0])}</span><span class="pp ${x[1]<=3?"g":""}">${ord(x[1])}</span></div>`).join("")}</div></div>`;
  }
  // career
  const c=p.cr;
  if(c){
    h+=`<div class="sec"><div class="sec-h"><h3>生涯数据</h3><span>GanglyStats 收录的正式赛</span></div><div class="mini">
      <div><span>局数</span><b>${c.gp}</b></div><div><span>平均名次</span><b>${c.avp.toFixed(2)}</b></div>
      <div><span>前四率</span><b>${pct(c.top4)}</b></div><div><span>大赛冠军</span><b>${p.ti}</b></div></div></div>`;
  }
  h+=`<div class="src">数据：<a href="https://ganglystats.com/player.html?id=${encodeURIComponent(p.gs)}" target="_blank">GanglyStats</a>（更新于 ${META.updated}）· Liquipedia<div class="keys">快捷键：选中后按 <kbd>S</kbd><kbd>A</kbd><kbd>B</kbd><kbd>C</kbd><kbd>G</kbd> 放入对应档位，<kbd>0</kbd> 退回选手池</div></div>`;
  wrap.insertAdjacentHTML("beforeend",h);
  pn.appendChild(wrap);
  if(!quiet) save();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  if(!selected||e.metaKey||e.ctrlKey||e.altKey) return;
  const map={s:"S",a:"A",b:"B",c:"C",g:"god","1":"S","2":"A","3":"B","4":"C","5":"god","0":"pool"};
  const z=map[e.key.toLowerCase()];if(!z) return;
  const card=document.querySelector(`.card[data-id="${selected}"]`);if(!card) return;
  zoneEl(z).appendChild(card);landed(card,z);
});

/* ---------- reset / export ---------- */
function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("on"),2200);}
$("#reset").addEventListener("click",()=>{
  const b=$("#reset");
  if(!b.dataset.arm){b.dataset.arm=1;b.textContent="再点一次确认";setTimeout(()=>{delete b.dataset.arm;b.textContent="重置";},2500);return;}
  delete b.dataset.arm;b.textContent="重置";
  try{localStorage.removeItem(STORE_KEY);}catch(e){}
  document.querySelectorAll(".card").forEach(c=>c.remove());selected=null;render();toast("已清空评级");
});
$("#export").addEventListener("click",async()=>{
  if(!window.htmlToImage){toast("导出组件没加载出来，检查一下网络");return;}
  const area=$("#exportArea");document.body.classList.add("exporting");await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
  try{
    const url=await htmlToImage.toPng(area,{pixelRatio:2,cacheBust:true,
      backgroundColor:"#0a1f18",filter:n=>!(n.dataset&&"noexport" in n.dataset)});
    const a=document.createElement("a");a.href=url;a.download="S18-世界赛选手评级.png";a.click();toast("图片已导出");
  }catch(e){console.error(e);toast("导出失败："+(e&&e.message||e));}
  document.body.classList.remove("exporting");
});

/* ---------- wisps ---------- */
(function(){
  const cv=$("#wisps"),cx=cv.getContext("2d");let W,H,ps=[];
  const cols=["125,255,208","215,146,255","243,210,122"];
  function rs(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;}
  rs();addEventListener("resize",rs);
  for(let i=0;i<46;i++)ps.push({x:Math.random(),y:Math.random(),r:.6+Math.random()*1.8,v:.00012+Math.random()*.00035,ph:Math.random()*6.28,c:cols[i%5===0?1:i%7===0?2:0]});
  function f(t){
    cx.clearRect(0,0,W,H);
    for(const p of ps){
      p.y-=p.v;if(p.y<-.05){p.y=1.05;p.x=Math.random();}
      const x=(p.x+Math.sin(t/2600+p.ph)*.012)*W,y=p.y*H,a=.35+.35*Math.sin(t/900+p.ph);
      const r=p.r*devicePixelRatio*5;const g=cx.createRadialGradient(x,y,0,x,y,r);
      g.addColorStop(0,`rgba(${p.c},${a})`);g.addColorStop(.25,`rgba(${p.c},${a*.45})`);g.addColorStop(1,`rgba(${p.c},0)`);
      cx.fillStyle=g;cx.beginPath();cx.arc(x,y,r,0,6.28);cx.fill();
    }
    requestAnimationFrame(f);
  }
  requestAnimationFrame(f);
})();

render();
</script>
